/* Recta de decisión en 2D: S = w1·x1 + w2·x2 + θ·x0 con x0 = −1 */
function crearRecta(contenedor) {
  const caja = el("div", { class: "lienzo-vivo" });
  caja.appendChild(el("p", {}, "<b>La frontera en vivo.</b> Mueve los controles y toca el lienzo para poner el punto. La zona sombreada es donde S ≥ 0, es decir, donde la neurona responde 1."));
  const canvas = el("canvas", { width: 960, height: 540, "aria-label": "Recta de decisión con un punto" });
  const controles = el("div", { class: "rejilla-campos" });
  const valores = { w1: 1, w2: 1, theta: 3 };
  let P = [3, 2];
  const rangos = { w1: [-3, 3, 0.1, "w1"], w2: [-3, 3, 0.1, "w2"], theta: [-8, 8, 0.5, "θ"] };
  for (const k in rangos) {
    const [mn, mx, paso, nombre] = rangos[k];
    const c = el("div", { class: "campo" });
    const etiqueta = el("label", { for: "recta-" + k }, `${nombre} = ${fmt(valores[k], 1)}`);
    const control = el("input", { id: "recta-" + k, type: "range", min: mn, max: mx, step: paso, value: valores[k] });
    control.addEventListener("input", () => { valores[k] = parseFloat(control.value); etiqueta.textContent = `${nombre} = ${fmt(valores[k], 1)}`; dibujar(); });
    c.append(etiqueta, control);
    controles.appendChild(c);
  }
  const lectura = el("div", { class: "traza", "aria-live": "polite" });
  caja.append(controles, canvas, lectura);
  contenedor.appendChild(caja);

  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, ESC = H / 11;
  const aPx = (a, b) => [W / 2 + a * ESC, H / 2 - b * ESC];
  const dePx = (px, py) => [(px - W / 2) / ESC, (H / 2 - py) / ESC];
  const S = x => valores.w1 * x[0] + valores.w2 * x[1] + valores.theta * -1;

  function dibujar() {
    const tinta = colorVar("--tinta"), roja = colorVar("--correccion");
    ctx.fillStyle = colorVar("--hoja"); ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = 0.1; ctx.fillStyle = tinta;
    for (let px = 0; px < W; px += 10) for (let py = 0; py < H; py += 10)
      if (S(dePx(px + 5, py + 5)) >= 0) ctx.fillRect(px, py, 10, 10);
    ctx.restore();
    ctx.strokeStyle = colorVar("--linea"); ctx.lineWidth = 1;
    for (let g = -9; g <= 9; g++) {
      const [px] = aPx(g, 0), [, py] = aPx(0, g);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
    }
    ctx.strokeStyle = colorVar("--lapiz"); ctx.lineWidth = 2;
    const [ox, oy] = aPx(0, 0);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
    ctx.fillStyle = colorVar("--lapiz"); ctx.font = "22px sans-serif";
    ctx.fillText("x1", W - 34, oy - 8); ctx.fillText("x2", ox + 8, 24);
    // recta: w1·x1 + w2·x2 − θ = 0
    ctx.strokeStyle = colorVar("--grafito"); ctx.lineWidth = 3; ctx.beginPath();
    if (Math.abs(valores.w2) > 1e-9) {
      const [ax, ay] = aPx(-10, (valores.theta - valores.w1 * -10) / valores.w2);
      const [bx, by] = aPx(10, (valores.theta - valores.w1 * 10) / valores.w2);
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    } else if (Math.abs(valores.w1) > 1e-9) {
      const [px] = aPx(valores.theta / valores.w1, 0); ctx.moveTo(px, 0); ctx.lineTo(px, H);
    }
    ctx.stroke();
    const s = S(P), arriba = s >= 0;
    const [px, py] = aPx(P[0], P[1]);
    ctx.fillStyle = arriba ? tinta : roja; ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.fill();
    lectura.innerHTML = `Punto x = (${fmt(P[0], 2)}; ${fmt(P[1], 2)})\n` +
      `F1  S = (${fmt(valores.w1, 1)})(${fmt(P[0], 2)}) + (${fmt(valores.w2, 1)})(${fmt(P[1], 2)}) + (${fmt(valores.theta, 1)})(−1) = ${fmt(s, 2)}\n` +
      `F2  S ${arriba ? "≥" : "<"} 0  →  y = ${arriba ? 1 : -1}  ` +
      `<span class="${arriba ? "ok" : "mal"}">(${arriba ? "lado sombreado" : "lado sin sombra"})</span>` +
      (Math.abs(valores.w1) < 1e-9 && Math.abs(valores.w2) < 1e-9 ? "\nCon los dos pesos en cero no hay recta: todos los puntos dan la misma S." : "");
  }
  canvas.addEventListener("pointerdown", ev => {
    const r = canvas.getBoundingClientRect();
    P = dePx((ev.clientX - r.left) * (W / r.width), (ev.clientY - r.top) * (H / r.height));
    dibujar();
  });
  dibujar();
}

/* Generador congruencial igual al de aleatorio.py (F11). Los productos caben
   exactos en un número de JavaScript porque a·X < 2^53. */
function crearCongruencial(semilla) {
  const A = 1664525, C = 1013904223, M = 4294967296;
  let X = ((Math.trunc(semilla) % M) + M) % M;
  return {
    get X() { return X; },
    siguiente() { const anterior = X; X = (A * X + C) % M; return { anterior, X, U: (X + 0.5) / M }; },
    U() { X = (A * X + C) % M; return (X + 0.5) / M; }
  };
}

/* Histograma de las cuatro distribuciones con las fórmulas F12 a F15.
   Solo en esta demostración se usan Math.log, Math.cos y Math.sqrt del
   navegador; en el proyecto son las funciones de formulas.py. */
function crearHistograma(contenedor) {
  const caja = el("div", { class: "lienzo-vivo" });
  caja.appendChild(el("p", {}, "<b>Ver una distribución.</b> Elige la distribución, la media μ y la desviación σ, y genera 5000 valores con el mismo generador y las mismas fórmulas F12 a F15 de tu proyecto. La línea punteada marca μ."));
  const controles = el("div", { class: "rejilla-campos" });
  const campo = (id, texto, nodo) => { const c = el("div", { class: "campo" }); c.append(el("label", { for: id }, texto), nodo); controles.appendChild(c); return nodo; };
  const dist = campo("hist-dist", "Distribución", el("select", { id: "hist-dist" }, ["normal", "uniforme", "exponencial", "binomial"].map(d => `<option>${d}</option>`).join("")));
  const mu = campo("hist-mu", "Media μ", el("input", { id: "hist-mu", value: "5", inputmode: "decimal" }));
  const sigma = campo("hist-sigma", "Desviación σ", el("input", { id: "hist-sigma", value: "1", inputmode: "decimal" }));
  const semilla = campo("hist-semilla", "Semilla", el("input", { id: "hist-semilla", value: "7", inputmode: "numeric" }));
  const canvas = el("canvas", { width: 960, height: 400, "aria-label": "Histograma de la distribución" });
  canvas.style.aspectRatio = "960 / 400";   // la regla general de .lienzo-vivo es 16:9 y lo estiraría
  const lectura = el("div", { class: "traza", "aria-live": "polite" });
  const fila = el("div", { class: "fila-botones" });
  fila.appendChild(el("button", { class: "boton", onclick: generar }, "Generar 5000 valores"));
  caja.append(controles, fila, canvas, lectura);
  contenedor.appendChild(caja);
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  function muestra(g, d, m, s) {
    if (d === "normal") { const U1 = g.U(), U2 = g.U(); return m + s * Math.sqrt(-2 * Math.log(U1)) * Math.cos(2 * Math.PI * U2); }   // F12
    if (d === "uniforme") { const a = s * Math.sqrt(3); return (m - a) + 2 * a * g.U(); }                                          // F13
    if (d === "exponencial") return (m - s) - s * Math.log(g.U());                                                               // F14
    let exitos = 0; for (let k = 0; k < 20; k++) if (g.U() < 0.5) exitos++;                                                       // F15
    return m + s * (exitos - 10) / Math.sqrt(5);
  }
  function generar() {
    const m = leerNumero(mu.value), s = leerNumero(sigma.value), sem = parseInt(semilla.value, 10);
    if (![m, s, sem].every(Number.isFinite) || s < 0) { lectura.innerHTML = '<span class="mal">Escribe números válidos: σ no puede ser negativa y la semilla debe ser un entero.</span>'; return; }
    const g = crearCongruencial(sem), N = 5000, valores = [];
    for (let i = 0; i < N; i++) valores.push(muestra(g, dist.value, m, s));
    let lo = valores[0], hi = valores[0], suma = 0;
    for (const v of valores) { if (v < lo) lo = v; if (v > hi) hi = v; suma += v; }
    const media = suma / N;
    let cuad = 0; for (const v of valores) cuad += (v - media) * (v - media);
    const desv = Math.sqrt(cuad / N);
    const B = 50, ancho = (hi - lo) || 1, cuentas = new Array(B).fill(0);
    for (const v of valores) cuentas[Math.min(B - 1, Math.floor((v - lo) / ancho * B))]++;
    let mayor = 1; for (const c of cuentas) if (c > mayor) mayor = c;
    ctx.fillStyle = colorVar("--hoja"); ctx.fillRect(0, 0, W, H);
    const base = H - 40, alto = H - 70, izq = 30, der = W - 30, bw = (der - izq) / B;
    ctx.fillStyle = colorVar("--tinta");
    cuentas.forEach((c, i) => { const h = c / mayor * alto; ctx.fillRect(izq + i * bw + 1, base - h, bw - 2, h); });
    ctx.strokeStyle = colorVar("--lapiz"); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(izq, base); ctx.lineTo(der, base); ctx.stroke();
    const xMu = izq + (m - lo) / ancho * (der - izq);
    ctx.strokeStyle = colorVar("--correccion"); ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(xMu, base); ctx.lineTo(xMu, 18); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = colorVar("--lapiz"); ctx.font = "20px sans-serif";
    ctx.fillText(fmt(lo, 2), izq, base + 28); ctx.fillText(fmt(hi, 2), der - 60, base + 28);
    lectura.innerHTML = `Distribución ${dist.value}, ${N} valores\n` +
      `Media pedida  ${fmt(m, 3)}   →  obtenida ${fmt(media, 3)}   (F16)\n` +
      `σ pedida      ${fmt(s, 3)}   →  obtenida ${fmt(desv, 3)}   (F17)\n` +
      `Valor mínimo ${fmt(lo, 3)}   ·   valor máximo ${fmt(hi, 3)}`;
  }
  generar();
}

/* El congruencial paso a paso y Fisher-Yates con el mismo generador */
function crearGenerador(contenedor) {
  const caja = el("div", { class: "hoja" });
  caja.appendChild(el("p", {}, "<b>El generador a mano.</b> Escribe una semilla y pide números: cada uno sale de F11 aplicada al anterior. Prueba la semilla 7 y compara con los valores de la lección. Luego baraja la lista [0, 1, 2, 3, 4] con Fisher-Yates."));
  const c = el("div", { class: "campo" });
  const entrada = el("input", { id: "gen-semilla", value: "7", inputmode: "numeric" });
  c.append(el("label", { for: "gen-semilla" }, "Semilla"), entrada);
  const salida = el("div", { class: "traza", "aria-live": "polite" });
  let g = null, k = 0, texto = "";
  const leerSemilla = () => { const s = parseInt(entrada.value, 10); if (!Number.isFinite(s)) { salida.innerHTML = '<span class="mal">La semilla debe ser un número entero.</span>'; return null; } return s; };
  const reiniciar = () => { const s = leerSemilla(); if (s === null) return false; g = crearCongruencial(s); k = 0; texto = `X0 = semilla mod 2³² = ${g.X}\n`; salida.textContent = texto; return true; };
  const siguiente = () => {
    if (!g && !reiniciar()) return;
    const { anterior, X, U } = g.siguiente(); k++;
    texto += `X${k} = (1664525 · ${anterior} + 1013904223) mod 4294967296 = ${X}   →   U${k} = (${X} + 0,5) / 2³² = ${fmt(U, 6)}\n`;
    salida.textContent = texto;
  };
  const barajar = () => {
    const s = leerSemilla(); if (s === null) return;
    const gb = crearCongruencial(s), lista = [0, 1, 2, 3, 4];
    let t = `Fisher-Yates con un generador nuevo (semilla ${s}) sobre [${lista.join(", ")}]\n`;
    for (let i = lista.length - 1; i > 0; i--) {
      const U = gb.U(), j = Math.floor(U * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
      t += `i = ${i}: U = ${fmt(U, 4)}, j = int(U · ${i + 1}) = ${j}   →   intercambio posiciones ${i} y ${j}: [${lista.join(", ")}]\n`;
    }
    salida.textContent = t + `Resultado: [${lista.join(", ")}]`;
    g = null;
  };
  const fila = el("div", { class: "fila-botones" });
  fila.append(el("button", { class: "boton", onclick: siguiente }, "Siguiente número"),
    el("button", { class: "boton secundario", onclick: reiniciar }, "Volver a la semilla"),
    el("button", { class: "boton secundario", onclick: barajar }, "Barajar [0, 1, 2, 3, 4]"));
  caja.append(c, fila, salida);
  contenedor.appendChild(caja);
  reiniciar(); siguiente(); siguiente();
}

function correrNivel(v, indice) {
  const nivel = NIVELES[indice];
  let actual = 0, aciertos = 0;
  const zona = el("div", { class: "hoja" });
  v.append(el("h2", {}, nivel.nombre), zona);

  function pintar() {
    zona.innerHTML = "";
    if (actual >= nivel.preguntas.length) return final();
    const p = nivel.preguntas[actual];
    zona.append(el("div", { class: "pregunta-num" }, `Pregunta ${actual + 1} de ${nivel.preguntas.length} · aciertos ${aciertos}`),
      el("div", { class: "enunciado" }, p.enunciado));
    const retro = el("div", { "aria-live": "polite" });
    const siguiente = el("button", { class: "boton oculto", onclick: () => { actual++; pintar(); } }, actual + 1 < nivel.preguntas.length ? "Siguiente pregunta" : "Ver resultado");

    if (p.tipo === "opcion") {
      const botones = p.opciones.map(([texto, correcta, porque]) => el("button", { class: "opcion" }, escapar(texto)));
      botones.forEach((b, k) => b.addEventListener("click", () => {
        const [, correcta, porque] = p.opciones[k];
        if (correcta) aciertos++;
        botones.forEach((x, j) => { x.disabled = true; if (p.opciones[j][1]) x.classList.add("correcta"); });
        if (!correcta) b.classList.add("incorrecta");
        const buena = p.opciones.find(o => o[1]);
        retro.className = "retro " + (correcta ? "bien" : "mal");
        retro.innerHTML = `<span class="veredicto">${correcta ? "Correcto." : "No es esa."}</span>${escapar(porque)}` +
          (correcta ? "" : `<br><br><b>La correcta:</b> ${escapar(buena[2])}`);
        siguiente.classList.remove("oculto"); siguiente.focus();
      }));
      zona.append(...botones);
    } else {
      const campo = el("div", { class: "campo" });
      const entrada = el("input", { id: "resp-num", inputmode: "decimal", placeholder: "Escribe tu resultado" });
      campo.append(el("label", { for: "resp-num" }, "Tu respuesta"), entrada);
      const verificar = el("button", { class: "boton", onclick: () => {
        const r = leerNumero(entrada.value);
        if (Number.isNaN(r)) { retro.className = "retro mal"; retro.innerHTML = '<span class="veredicto">Falta un número.</span>Escribe tu resultado con coma o punto decimal.'; return; }
        const bien = Math.abs(r - p.respuesta) <= p.tolerancia;
        if (bien) aciertos++;
        entrada.disabled = true; verificar.disabled = true;
        retro.className = "retro " + (bien ? "bien" : "mal");
        retro.innerHTML = `<span class="veredicto">${bien ? "Correcto." : "No coincide: esperaba " + fmt(p.respuesta, 3) + "."}</span>${escapar(p.explicacion)}`;
        siguiente.classList.remove("oculto"); siguiente.focus();
      } }, "Verificar");
      entrada.addEventListener("keydown", e => { if (e.key === "Enter" && !verificar.disabled) verificar.click(); });
      const filaV = el("div", { class: "fila-botones" }); filaV.appendChild(verificar);
      zona.append(campo, filaV);
    }
    const filaS = el("div", { class: "fila-botones" }); filaS.appendChild(siguiente);
    zona.append(retro, filaS);
  }

  function final() {
    const pct = Math.round(100 * aciertos / nivel.preguntas.length);
    estado.niveles[indice] = Math.max(estado.niveles[indice], pct); guardar();
    const aprobado = pct >= 70;
    zona.append(el("div", { class: "enunciado" }, `Obtuviste ${aciertos} de ${nivel.preguntas.length} (${pct} %).`),
      el("p", {}, aprobado
        ? (indice < NIVELES.length - 1 ? "Superaste el 70 %, así que el siguiente nivel quedó desbloqueado." : "Completaste el nivel más difícil. Ahora practica la sustentación en voz alta.")
        : "Te faltó poco. Repasa los módulos relacionados con las preguntas que fallaste y vuelve a intentarlo."));
    const fila = el("div", { class: "fila-botones" });
    fila.appendChild(el("button", { class: "boton secundario", onclick: () => ir("evaluacion", { nivel: indice }) }, "Repetir nivel"));
    if (aprobado && indice < NIVELES.length - 1) fila.appendChild(el("button", { class: "boton", onclick: () => ir("evaluacion", { nivel: indice + 1 }) }, "Ir al siguiente nivel"));
    else if (aprobado) fila.appendChild(el("button", { class: "boton", onclick: () => ir("sustentacion") }, "Ir a la sustentación"));
    fila.appendChild(el("button", { class: "boton secundario", onclick: () => ir("evaluacion") }, "Ver niveles"));
    zona.appendChild(fila);
  }
  pintar();
}

    resp.innerHTML = `<span class="veredicto">Respuesta modelo</span>${escapar(preguntaSim.r)}`;
    resp.classList.remove("oculto");
    estado.repasadas[preguntaSim.p] = true; guardar();
  };
  const fila = el("div", { class: "fila-botones", style: "justify-content:center" });
  fila.append(el("button", { class: "boton", onclick: nueva }, "Nueva pregunta"), el("button", { class: "boton secundario", onclick: mostrar }, "Ver respuesta modelo"));
  sim.append(reloj, texto, fila, resp);
  v.appendChild(sim);
  lienzosActivos.push({ detener: () => clearInterval(idReloj) });

  // Banco de preguntas por tema
  v.appendChild(el("h2", {}, "Banco de preguntas probables"));
  const temas = [...new Set(SUSTENTACION.map(s => s.tema))];
  temas.forEach(t => {
    v.appendChild(el("h3", {}, t));
    SUSTENTACION.filter(s => s.tema === t).forEach(s => {
      const d = el("details", { class: "acordeon" });
      d.append(el("summary", {}, `${escapar(s.p)}${estado.repasadas[s.p] ? '<span class="etiqueta-tema">repasada</span>' : ""}`), el("div", { class: "cuerpo" }, `<p>${escapar(s.r)}</p>`));
      d.addEventListener("toggle", () => { if (d.open && !estado.repasadas[s.p]) { estado.repasadas[s.p] = true; guardar(); } });
      v.appendChild(d);
    });
  });

  v.appendChild(el("h2", {}, "Errores comunes que debes evitar"));
  const lista = el("ul", { class: "lista-errores" });
  ERRORES_COMUNES.forEach(([t, d]) => lista.appendChild(el("li", {}, `<b>${t}.</b> ${d}`)));
  v.appendChild(lista);
}

/* =====================================================================
   VISTA 5: ANÁLISIS DE CÓDIGO
   ===================================================================== */
function vistaCodigo(v, opciones) {
  v.appendChild(el("h1", {}, "Análisis de código"));
  v.appendChild(el("p", { class: "entrada" }, "Las secciones más importantes de tu proyecto, explicadas línea por línea, con la razón de cada decisión de diseño. Filtra por archivo para ir directo al que te pregunten."));
  const filtro = (opciones && opciones.archivo) || "todos";
  const archivos = ["todos", ...Object.keys(FUNCIONES)];
  const pestanas = el("div", { class: "pestanas", role: "tablist" });
  archivos.forEach(a => pestanas.appendChild(el("button", { class: "pestana", role: "tab", "aria-selected": String(a === filtro), onclick: () => ir("codigo", { archivo: a }) }, a === "todos" ? "Todos" : a)));
  v.appendChild(pestanas);

  // Catálogo de todas las funciones: al elegir un archivo aparece primero;
  // en «Todos» queda plegado para no tapar el análisis línea por línea.
  const catalogo = (archivo, destino) => {
    const envoltura = el("div", { class: "tabla-wrap" });
    const tabla = el("table", { class: "catalogo" });
    tabla.innerHTML = "<thead><tr><th>Nombre</th><th>Qué hace</th></tr></thead>";
    const cuerpo = el("tbody");
    FUNCIONES[archivo].forEach(([n, d]) => cuerpo.appendChild(el("tr", {}, `<td class="mono">${escapar(n)}</td><td>${escapar(d)}</td>`)));
    tabla.appendChild(cuerpo); envoltura.appendChild(tabla); destino.appendChild(envoltura);
  };
  if (filtro === "todos") {
    const d = el("details", { class: "acordeon" });
    d.appendChild(el("summary", {}, "Catálogo de todas las funciones del proyecto, archivo por archivo"));
    const cuerpo = el("div", { class: "cuerpo" });
    Object.keys(FUNCIONES).forEach(a => { cuerpo.appendChild(el("h3", {}, a)); catalogo(a, cuerpo); });
    d.appendChild(cuerpo);
    v.appendChild(d);
  } else {
    v.appendChild(el("h2", {}, `Todo lo que hay en ${filtro}`));
    v.appendChild(el("p", {}, `Cada función, clase y constante de ${filtro}, explicada en una frase. Debajo vienen los fragmentos más importantes línea por línea.`));
    catalogo(filtro, v);
  }

  ANALISIS.filter(b => filtro === "todos" || b.archivo === filtro).forEach(b => {
    v.appendChild(el("h3", {}, escapar(b.titulo)));
    v.appendChild(el("div", { class: "archivo" }, b.archivo));
    const tabla = el("div", { class: "anotado" });
    b.lineas.forEach(([codigo, exp], i) => {
      const fila = el("div", { class: "linea-cod" });
      fila.append(el("div", { class: "num" }, String(i + 1)), el("pre", {}, resaltarPython(codigo)), el("div", { class: "exp" }, exp ? escapar(exp) : ""));
      tabla.appendChild(fila);
    });
    v.appendChild(tabla);
    v.appendChild(el("div", { class: "nota-margen" }, `<strong>Por qué está hecho así</strong>${escapar(b.decision)}`));
  });

  v.appendChild(el("h2", {}, "Buenas prácticas aplicadas"));
  const bp = el("ul", { class: "lista-errores" });
  BUENAS_PRACTICAS.forEach(t => bp.appendChild(el("li", {}, escapar(t))));
  v.appendChild(bp);
  v.appendChild(el("h2", {}, "Mejoras futuras"));
  const mj = el("ul", { class: "lista-errores" });
  MEJORAS.forEach(([t, d]) => mj.appendChild(el("li", {}, `<b>${t}.</b> ${escapar(d)}`)));
  v.appendChild(mj);
}

/* =====================================================================
   VISTA 6: REPASO FINAL
   ===================================================================== */
function vistaRepaso(v) {
  v.appendChild(el("h1", {}, "Repaso final"));
  v.appendChild(el("p", { class: "entrada" }, "Todo lo que necesitas tener fresco antes de entrar a la sustentación, en una sola página."));
  v.appendChild(el("h2", {}, "Las fórmulas del proyecto"));
  const envoltura = el("div", { class: "tabla-wrap" });
  const tabla = el("table");
  tabla.innerHTML = "<thead><tr><th>Código</th><th>Fórmula</th><th>Para qué</th></tr></thead>";
  const cuerpo = el("tbody");
  REPASO.forEach(([c, f, d]) => cuerpo.appendChild(el("tr", {}, `<td class="mono">${c}</td><td class="mono">${escapar(f)}</td><td>${d}</td>`)));
  tabla.appendChild(cuerpo); envoltura.appendChild(tabla); v.appendChild(envoltura);

  v.appendChild(el("h2", {}, "Resultados que conviene recordar"));
  v.appendChild(el("p", {}, "Con la semilla 7, dos clases separadas convergieron en 6 épocas con 100 % de exactitud, y las mismas clases solapadas llegaron a 100 épocas sin converger, con 61,5 %. Con 100 contra 10 instancias (Desbalanceadas) la exactitud global subió a 95,5 % pero la clase pequeña quedó en 50 %. En tres clases, la cascada convergió en una época por perceptrón y uno contra el resto en 1, 13 y 9 épocas, ambas con 100 %. En regresión lineal el error se estabilizó en 265 épocas y el perceptrón aprendió w = (2,002; −1,495; 0,454) y un sesgo de 3,169 frente a los valores reales (2; −1,5; 0,5) y 3, con un ECM de 1,076 y un R² de 0,964. Con el modelo cuadrático se estabilizó en 181 épocas con un ECM de 81,5, aunque el R² se mantuvo en 0,97. Con γ = 0,02 se estabilizó en solo 24 épocas pero con un R² de −1,39, y con γ = 0,05 la regresión divergió en la primera época."));
  v.appendChild(el("h2", {}, "Cinco frases que no pueden faltar"));
  const lista = el("ol", { class: "lista-errores" });
  FRASES_CLAVE.forEach(f => lista.appendChild(el("li", {}, escapar(f))));
  v.appendChild(lista);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
construirNavegacion();
actualizarProgreso();
/* Menú lateral en pantallas angostas: cerrado queda fuera de la pantalla, así
   que se marca inert para que Tab no entre en él; tocar el contenido lo cierra. */
const pantallaAngosta = matchMedia("(max-width: 860px)");
function ponerMenu(abierto) {
  const lateral = $("#lateral");
  lateral.classList.toggle("abierta", abierto);
  lateral.inert = pantallaAngosta.matches && !abierto;
  $("#abrirMenu").setAttribute("aria-expanded", String(abierto));
}
$("#abrirMenu").addEventListener("click", () => ponerMenu(!$("#lateral").classList.contains("abierta")));
$(".contenido").addEventListener("click", () => { if ($("#lateral").classList.contains("abierta")) ponerMenu(false); });
pantallaAngosta.addEventListener("change", () => ponerMenu(false));
ponerMenu(false);
$("#cambiarTema").addEventListener("click", () => {
  const raiz = document.documentElement;
  const oscuroAhora = raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  raiz.dataset.theme = oscuroAhora ? "light" : "dark";
  try { localStorage.setItem(CLAVE + "-tema", raiz.dataset.theme); } catch (e) {}
  ir(seccionActual);   // redibuja los lienzos con los colores nuevos
});
$("#borrarProgreso").addEventListener("click", () => {
  if (!confirm("¿Borrar todo tu avance de estudio y evaluación?")) return;
  estado = estadoInicial(); guardar(); ir(seccionActual);
});
try { const t = localStorage.getItem(CLAVE + "-tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
let inicial = "inicio";
try { inicial = sessionStorage.getItem(CLAVE + "-seccion") || "inicio"; } catch (e) {}
ir(SECCIONES.some(s => s[0] === inicial) ? inicial : "inicio");
</script>
