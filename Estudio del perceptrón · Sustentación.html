<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS DE DISEÑO
   Idea visual: un cuaderno cuadriculado de ingeniería. Tinta azul para la
   estructura, resaltador amarillo para lo que hay que recordar y tinta roja
   de corrección para los errores, como cuando el profesor revisa a mano.
   ===================================================================== */
:root {
  --papel: #f6f8fc;
  --hoja: #ffffff;
  --cuadricula: rgba(40, 90, 170, 0.075);
  --tinta: #1c3d8c;
  --tinta-suave: #e5ebf8;
  --grafito: #252a33;
  --lapiz: #5d6573;
  --linea: #d6dceb;
  --resaltador: #fff0a0;
  --correccion: #c0392b;
  --correccion-suave: #fbe9e7;
  --acierto: #1f7a4d;
  --acierto-suave: #e3f3ea;
  --codigo-fondo: #f1f4fa;
  --sombra: 0 1px 0 rgba(28, 61, 140, 0.08);
  --fuente: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --radio: 6px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #11151d; --hoja: #171c26; --cuadricula: rgba(130, 165, 255, 0.06);
    --tinta: #93b1ff; --tinta-suave: #1f2940; --grafito: #e4e7ee; --lapiz: #9aa3b4;
    --linea: #2a3346; --resaltador: rgba(255, 228, 92, 0.22); --correccion: #ff7b6e;
    --correccion-suave: rgba(255, 123, 110, 0.12); --acierto: #6fd39d;
    --acierto-suave: rgba(111, 211, 157, 0.12); --codigo-fondo: #121722;
  }
}
:root[data-theme="dark"] {
  --papel: #11151d; --hoja: #171c26; --cuadricula: rgba(130, 165, 255, 0.06);
  --tinta: #93b1ff; --tinta-suave: #1f2940; --grafito: #e4e7ee; --lapiz: #9aa3b4;
  --linea: #2a3346; --resaltador: rgba(255, 228, 92, 0.22); --correccion: #ff7b6e;
  --correccion-suave: rgba(255, 123, 110, 0.12); --acierto: #6fd39d;
  --acierto-suave: rgba(111, 211, 157, 0.12); --codigo-fondo: #121722;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; min-height: 100%; font-family: var(--fuente); font-size: 17px; line-height: 1.6;
  color: var(--grafito); background-color: var(--papel);
  /* Cuadrícula del cuaderno: dos gradientes lineales cruzados */
  background-image:
    linear-gradient(var(--cuadricula) 1px, transparent 1px),
    linear-gradient(90deg, var(--cuadricula) 1px, transparent 1px);
  background-size: 22px 22px;
}
img, svg, canvas { max-width: 100%; }
a { color: var(--tinta); }
:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Estructura general: barra lateral + contenido ---------- */
.marco { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.lateral {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  background: var(--hoja); border-right: 1px solid var(--linea); padding: 22px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.marca { font-weight: 700; font-size: 1.05rem; color: var(--tinta); line-height: 1.25; margin-bottom: 2px; }
.marca small { display: block; font-weight: 400; color: var(--lapiz); font-size: 0.82rem; margin-top: 3px; }
.progreso-general { margin: 14px 0 18px; font-size: 0.85rem; color: var(--lapiz); }
.barra { height: 6px; background: var(--tinta-suave); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.barra > span { display: block; height: 100%; background: var(--tinta); width: 0; transition: width .4s; }
.nav-btn {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0;
  background: transparent; color: var(--grafito); font: inherit; font-size: 0.97rem;
  padding: 8px 10px; border-radius: var(--radio); cursor: pointer;
}
.nav-btn:hover { background: var(--tinta-suave); }
.nav-btn[aria-current="page"] { background: var(--tinta); color: var(--hoja); font-weight: 700; }
.nav-btn .n { font-family: var(--mono); font-size: 0.78rem; opacity: .7; min-width: 1.2em; }
.lateral .pie { margin-top: auto; padding-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.boton-chico {
  font: inherit; font-size: 0.82rem; border: 1px solid var(--linea); background: var(--hoja);
  color: var(--lapiz); padding: 5px 10px; border-radius: var(--radio); cursor: pointer;
}
.boton-chico:hover { color: var(--tinta); border-color: var(--tinta); }

.contenido { padding: 34px clamp(18px, 4vw, 56px) 80px; }
.columna { max-width: 820px; margin: 0 auto; }
.encabezado-movil { display: none; }

@media (max-width: 860px) {
  .marco { grid-template-columns: minmax(0, 1fr); }
  .lateral {
    position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 30;
    transform: translateX(-102%); transition: transform .25s; height: 100%;
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .lateral.abierta { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  .encabezado-movil {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20;
    background: var(--hoja); border-bottom: 1px solid var(--linea);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  }
  .encabezado-movil strong { color: var(--tinta); }
  .contenido { padding-top: 22px; }
}

/* ---------- Tipografía ---------- */
h1 { font-size: clamp(1.9rem, 4.2vw, 2.7rem); line-height: 1.1; margin: 0 0 14px; color: var(--grafito); letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; line-height: 1.2; margin: 42px 0 12px; color: var(--tinta); }
h3 { font-size: 1.18rem; margin: 28px 0 8px; }
p { margin: 0 0 14px; }
.entrada { font-size: 1.12rem; color: var(--lapiz); max-width: 64ch; }
.resaltado { background: linear-gradient(transparent 55%, var(--resaltador) 55%); padding: 0 2px; }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
:not(pre) > code { background: var(--codigo-fondo); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--linea); }
.formula {
  font-family: var(--mono); background: var(--hoja); border: 1px solid var(--linea);
  border-left: 4px solid var(--tinta); padding: 10px 14px; margin: 12px 0 16px;
  border-radius: 0 var(--radio) var(--radio) 0; overflow-x: auto; white-space: pre; font-size: 0.92rem;
}

/* ---------- Bloques de contenido ---------- */
.hoja { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px 22px; margin: 16px 0; box-shadow: var(--sombra); }
.nota-margen { border-left: 3px solid var(--resaltador); background: var(--hoja); padding: 12px 16px; margin: 16px 0; border-radius: 0 var(--radio) var(--radio) 0; }
.nota-margen.roja { border-left-color: var(--correccion); }
.nota-margen strong:first-child { display: block; margin-bottom: 2px; }
pre.codigo {
  font-family: var(--mono); font-size: 0.84rem; line-height: 1.55; background: var(--codigo-fondo);
  border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; overflow-x: auto; margin: 10px 0 16px;
}
.archivo { font-family: var(--mono); font-size: 0.78rem; color: var(--lapiz); margin-bottom: -6px; }
.kw { color: #7b3fb5; } .cm { color: #6b7a8f; font-style: italic; } .st { color: #2f7d4f; } .nu { color: #b05a12; }
:root[data-theme="dark"] .kw { color: #c99bff; } :root[data-theme="dark"] .st { color: #8fd6a8; } :root[data-theme="dark"] .nu { color: #f0a868; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .kw { color: #c99bff; } :root:not([data-theme="light"]) .st { color: #8fd6a8; } :root:not([data-theme="light"]) .nu { color: #f0a868; }
}

.boton {
  font: inherit; font-weight: 700; border: 2px solid var(--tinta); background: var(--tinta); color: var(--hoja);
  padding: 9px 18px; border-radius: var(--radio); cursor: pointer;
}
.boton.secundario { background: transparent; color: var(--tinta); }
.boton:disabled { opacity: .45; cursor: not-allowed; }
.fila-botones { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }

/* ---------- Inicio: perceptrón en vivo ---------- */
.lienzo-vivo { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; margin: 18px 0 8px; }
.lienzo-vivo canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 4px; cursor: crosshair; touch-action: none; }
.lectura { display: flex; flex-wrap: wrap; gap: 6px 22px; font-family: var(--mono); font-size: 0.82rem; color: var(--lapiz); margin-top: 10px; }
.lectura b { color: var(--grafito); font-weight: 600; }
.leyenda-lienzo { font-size: 0.9rem; color: var(--lapiz); margin: 6px 0 0; }

/* Mapa de dependencias */
.mapa { display: grid; gap: 10px; margin: 14px 0; }
.mapa-fila { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.nodo {
  font: inherit; font-family: var(--mono); font-size: 0.86rem; border: 1.5px solid var(--tinta); background: var(--hoja);
  color: var(--tinta); padding: 8px 12px; border-radius: var(--radio); cursor: pointer; min-width: 132px;
}
.nodo.visual { border-style: dashed; }
.nodo[aria-pressed="true"] { background: var(--tinta); color: var(--hoja); }
.capa { text-align: center; font-size: 0.8rem; color: var(--lapiz); }
.flecha { text-align: center; color: var(--lapiz); line-height: 1; }

/* Módulos de estudio */
.pestanas { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 18px; }
.pestana { font: inherit; font-size: 0.9rem; border: 1px solid var(--linea); background: var(--hoja); color: var(--grafito); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
.pestana[aria-selected="true"] { border-color: var(--tinta); background: var(--tinta-suave); color: var(--tinta); font-weight: 700; }
.pestana .hecho { color: var(--acierto); }
.parte-titulo { font-size: 0.95rem; font-weight: 700; color: var(--lapiz); margin: 26px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--linea); }

/* Calculadora y demos */
.rejilla-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
.campo label { display: block; font-size: 0.82rem; color: var(--lapiz); margin-bottom: 2px; }
.campo input, .campo select {
  width: 100%; font: inherit; font-family: var(--mono); font-size: 0.92rem; padding: 6px 8px;
  border: 1px solid var(--linea); border-radius: 4px; background: var(--papel); color: var(--grafito);
}
.traza { font-family: var(--mono); font-size: 0.86rem; white-space: pre-wrap; background: var(--codigo-fondo); border: 1px solid var(--linea); border-radius: var(--radio); padding: 12px 14px; overflow-x: auto; }
.traza .ok { color: var(--acierto); font-weight: 600; } .traza .mal { color: var(--correccion); font-weight: 600; }

/* Evaluación */
.niveles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
.nivel { text-align: left; font: inherit; background: var(--hoja); border: 1.5px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; cursor: pointer; color: var(--grafito); }
.nivel:hover:not(:disabled) { border-color: var(--tinta); }
.nivel:disabled { cursor: not-allowed; opacity: .55; }
.nivel strong { display: block; color: var(--tinta); font-size: 1.05rem; }
.nivel span { font-size: 0.88rem; color: var(--lapiz); }
.pregunta-num { font-size: 0.85rem; color: var(--lapiz); }
.enunciado { font-size: 1.1rem; font-weight: 700; margin: 4px 0 14px; }
.opcion {
  display: block; width: 100%; text-align: left; font: inherit; background: var(--hoja); color: var(--grafito);
  border: 1.5px solid var(--linea); border-radius: var(--radio); padding: 10px 14px; margin: 8px 0; cursor: pointer;
}
.opcion:hover:not(:disabled) { border-color: var(--tinta); }
.opcion.correcta { border-color: var(--acierto); background: var(--acierto-suave); }
.opcion.incorrecta { border-color: var(--correccion); background: var(--correccion-suave); }
.opcion:disabled { cursor: default; }
.retro { margin-top: 12px; padding: 12px 16px; border-radius: var(--radio); border: 1px solid var(--linea); background: var(--hoja); }
.retro.bien { border-left: 4px solid var(--acierto); }
.retro.mal { border-left: 4px solid var(--correccion); }
.retro .veredicto { font-weight: 700; display: block; margin-bottom: 4px; }
.retro.bien .veredicto { color: var(--acierto); } .retro.mal .veredicto { color: var(--correccion); }
.marcador { font-family: var(--mono); font-size: 0.9rem; color: var(--lapiz); }

/* Sustentación */
.acordeon { border: 1px solid var(--linea); border-radius: var(--radio); background: var(--hoja); margin: 10px 0; }
.acordeon summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; display: flex; gap: 10px; }
.acordeon summary::-webkit-details-marker { display: none; }
.acordeon summary::before { content: "+"; font-family: var(--mono); color: var(--tinta); }
.acordeon[open] summary::before { content: "−"; }
.acordeon .cuerpo { padding: 0 16px 14px 38px; }
.etiqueta-tema { font-size: 0.78rem; font-weight: 400; color: var(--lapiz); margin-left: auto; white-space: nowrap; }
.simulacro { text-align: center; }
.reloj { font-family: var(--mono); font-size: 2.2rem; color: var(--tinta); margin: 6px 0; }
.lista-errores li { margin-bottom: 10px; }

/* Análisis de código línea por línea */
.anotado { border: 1px solid var(--linea); border-radius: var(--radio); overflow: hidden; margin: 12px 0 22px; background: var(--hoja); }
.linea-cod { display: grid; grid-template-columns: 2.6em minmax(0, 1.15fr) minmax(0, 1fr); border-bottom: 1px solid var(--linea); }
.linea-cod:last-child { border-bottom: 0; }
.linea-cod .num { font-family: var(--mono); font-size: 0.74rem; color: var(--lapiz); text-align: right; padding: 7px 6px 0 0; background: var(--codigo-fondo); }
.linea-cod pre { margin: 0; padding: 6px 10px; font-family: var(--mono); font-size: 0.8rem; background: var(--codigo-fondo); overflow-x: auto; white-space: pre; }
.linea-cod .exp { padding: 6px 12px; font-size: 0.9rem; line-height: 1.45; border-left: 1px solid var(--linea); }
@media (max-width: 700px) {
  .linea-cod { grid-template-columns: 2.4em minmax(0, 1fr); }
  .linea-cod .exp { grid-column: 1 / -1; border-left: 0; border-top: 1px dashed var(--linea); }
}
.tabla-wrap { overflow-x: auto; margin: 12px 0 18px; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; background: var(--hoja); }
th, td { border-bottom: 1px solid var(--linea); padding: 8px 10px; text-align: left; vertical-align: top; }
th { color: var(--tinta); border-bottom: 2px solid var(--tinta); }
td.mono { white-space: nowrap; }

/* Desde cero: controles deslizantes, pasos, buscador y glosario */
.campo input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--tinta); }
.lienzo-vivo .traza { margin-top: 10px; }
.lienzo-vivo .rejilla-campos { margin-top: 0; }
ol.pasos { padding-left: 1.4em; }
ol.pasos li { margin-bottom: 10px; }
.buscador {
  width: 100%; font: inherit; padding: 8px 12px; margin: 6px 0 14px; border: 1px solid var(--linea);
  border-radius: var(--radio); background: var(--hoja); color: var(--grafito);
}
.glosario { margin: 0; }
.glosario dt { font-weight: 700; color: var(--tinta); margin-top: 12px; }
.glosario dd { margin: 2px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--linea); }
table.catalogo td.mono { white-space: normal; min-width: 11em; overflow-wrap: anywhere; }
.oculto { display: none !important; }
</style>
</head>
<body>

<script>
/* =====================================================================
   CONTENIDO DE ESTUDIO
   Cada módulo tiene tres partes: la teoría, el fragmento real del proyecto
   donde esa teoría se implementa ("en tu código") y la idea clave que hay
   que poder decir en la sustentación. Si el módulo tiene una demostración
   interactiva, el campo "demo" indica cuál se dibuja.
   ===================================================================== */
const MODULOS = [
{
  id: "neurona",
  titulo: "La neurona y el perceptrón",
  teoria: `
<p>El perceptrón es el modelo más sencillo de neurona artificial. Su antecedente es la neurona lógica de McCulloch y Pitts (1943), que ya combinaba entradas y las comparaba con un umbral, pero fue Frank Rosenblatt (1958) quien le añadió algo decisivo: una regla para <span class="resaltado">ajustar los pesos a partir de los errores</span>, es decir, para aprender de ejemplos. Por eso se le considera el punto de partida del aprendizaje supervisado con redes neuronales.</p>
<p>La neurona recibe un vector de entradas, en este proyecto tres coordenadas <code>x1, x2, x3</code> de un punto en el espacio, y a cada entrada le asigna un peso <code>wi</code> que mide cuánto influye en la decisión. Primero calcula la <b>suma ponderada</b>, que es una combinación lineal de las entradas, y después la pasa por una <b>función de activación</b>. En clasificación esa función es el escalón: si la suma alcanza el umbral la neurona responde con la salida alta, y si no, con la baja.</p>
<div class="formula">F1  S = w1·x1 + w2·x2 + w3·x3 + θ·x0
F2  y = salida_alta  si S ≥ umbral
    y = salida_baja  si S &lt; umbral</div>
<p>El término <code>θ·x0</code> es el sesgo. En la convención de la clase la entrada del sesgo es fija y vale <code>x0 = −1</code>, de modo que la suma queda como <code>S = Σwi·xi − θ</code>, y θ funciona como un umbral que se aprende. Otros libros usan <code>x0 = +1</code> y llaman <code>b</code> al sesgo. Las dos formas son equivalentes porque basta cambiar el signo del parámetro aprendido, y el proyecto permite elegir cualquiera de las dos, siempre que se use el mismo <code>x0</code> en la suma y en el ajuste del sesgo.</p>
<p>Geométricamente, la ecuación <code>S = umbral</code> describe un plano en el espacio de tres dimensiones. Todo lo que el perceptrón hace al clasificar es decidir de qué lado de ese plano cae cada punto, y aprender consiste en mover y girar el plano hasta que deje cada clase en su lado.</p>`,
  archivo: "formulas.py",
  codigo: String.raw`def suma_ponderada(w, x, theta, x0):
    """F1:  S = w1*x1 + w2*x2 + ... + wn*xn + theta*x0

    Con x0 = -1 (convención de la clase):  S = w1*x1 + w2*x2 + w3*x3 - theta
    Con x0 = +1 (otra bibliografía):       S = w1*x1 + w2*x2 + w3*x3 + b"""
    S = 0.0
    for i in range(len(w)):
        S = S + w[i] * x[i]
    S = S + theta * x0
    return S


def funcion_escalon(S, umbral, salida_alta, salida_baja):
    """F2:  y = salida_alta  si S >= umbral
            y = salida_baja  si S <  umbral"""
    if S >= umbral:
        return salida_alta
    return salida_baja`,
  idea: `La suma ponderada se calcula con un ciclo <code>for</code> sencillo y no con un producto punto de una librería, porque la regla del curso exige que la matemática se escriba a mano. El umbral y las dos salidas del escalón son configurables, así que el mismo código sirve para salidas 1/−1, como en la clase, o 1/0. La única condición, que valida la interfaz, es que la salida alta sea mayor que la baja; el módulo 2 explica por qué.`,
  demo: null
},
{
  id: "aprendizaje",
  titulo: "Regla de aprendizaje y épocas",
  teoria: `
<p>Aprender, para el perceptrón, significa corregir los pesos cada vez que se equivoca. Para cada instancia se calcula la salida <code>y</code>, se compara con la salida deseada <code>d</code> y se obtiene el error <code>e = d − y</code>. Si el error es cero no se toca nada, y si no lo es, cada peso se mueve en la dirección que reduce ese error, en una cantidad proporcional a la tasa de aprendizaje γ y a la entrada que lo acompaña.</p>
<div class="formula">F4  e = d − y
F5  wi(nuevo) = wi + γ · e · xi
F6  θ(nuevo)  = θ  + γ · e · x0
F7  err = ½ · Σ e²         (error de la época)</div>
<p>La intuición es sencilla. Si la neurona respondió −1 cuando debía responder 1, el error es positivo y los pesos se acercan al punto mal clasificado, lo que aumenta la suma la próxima vez. Si respondió 1 cuando debía responder −1, ocurre lo contrario. El sesgo se ajusta con exactamente la misma regla, porque desde el punto de vista matemático es un peso más cuya entrada siempre vale <code>x0</code>.</p>
<p>Esa intuición depende de que la <span class="resaltado">salida alta sea mayor que la baja</span>. Si se escribieran al revés, por ejemplo alta 0 y baja 1, el signo del error se invertiría y cada corrección alejaría el plano de la solución en lugar de acercarlo. Con la semilla 7 y las clases separadas, un perceptrón con las salidas invertidas se queda en 50 % de exactitud y nunca converge, aunque el problema sea separable. Por eso <code>_config_clasificacion</code> de <code>main.py</code> rechaza ese caso con un mensaje, igual que rechaza dos salidas iguales; y por la misma razón <code>leer_tasa</code> exige que γ sea mayor que cero, porque una tasa negativa también invierte el sentido de cada corrección.</p>
<p>Una <b>época</b> es una pasada completa por todas las instancias. Al terminar cada época el programa hace lo que en clase se llamó "la repasadita": recorre de nuevo todo el conjunto con los pesos ya ajustados y calcula el error F7. Ese valor es el que se dibuja en la gráfica de épocas. El entrenamiento se detiene cuando el error llega al mínimo permitido (convergió), cuando el error explota (divergió) o cuando se agotan las épocas (no convergió). En regresión hay un cuarto motivo, que el error deje de bajar (se estabilizó), y se explica en el módulo 5.</p>
<p>Antes de cada época las instancias se <b>barajan</b> con el algoritmo de Fisher-Yates usando el generador propio. Esto evita que el orden fijo de los datos, que vienen agrupados por clase, sesgue el recorrido del plano. En Clasificación y Regresión puede desactivarse con la casilla «Barajar instancias en cada época», y el ejemplo de clase entrena siempre sin barajar, porque <code>ejecutar_ejemplo_clase</code> llama a <code>entrenar</code> con <code>barajar=False</code> para respetar el orden de las diapositivas.</p>`,
  archivo: "perceptron.py",

  teoria: `
<p>El perceptrón solo puede trazar un plano, así que solo puede resolver problemas <b>linealmente separables</b>, en los que existe al menos un plano que deja todas las instancias de una clase de un lado y todas las de la otra del lado contrario. El teorema de convergencia del perceptrón (Novikoff, 1962) garantiza que, si el conjunto es separable, la regla de ajuste encuentra un plano separador en un número finito de pasos.</p>
<p>Lo interesante para la sustentación es la otra cara del teorema. Si las clases se solapan, no existe tal plano y el algoritmo <span class="resaltado">nunca se estabiliza</span>: cada corrección que arregla un punto mal clasificado desarregla otro, el plano sigue moviéndose y el error por época oscila sin llegar a cero. Minsky y Papert (1969) mostraron con el problema XOR que esta limitación es estructural y no se arregla con más épocas, lo que más tarde motivó las redes de varias capas.</p>
<p>El simulador tiene los botones <b>Separadas</b>, <b>Cercanas</b> y <b>Solapadas</b> precisamente para "reventar" el perceptrón en vivo. Con las clases separadas y la semilla 7, el caso de dos clases convergió en 6 épocas con 100 % de exactitud. Con las clases solapadas, el mismo perceptrón llegó a las 100 épocas sin converger y se quedó en 61,5 % de exactitud, con una gráfica de error que sube y baja entre aproximadamente 130 y 200 sin ninguna tendencia.</p>
<p>Hay una tercera forma de reventarlo, que el profesor mencionó en clase: el <b>desbalance</b>. Con el escenario <b>Desbalanceadas</b>, 100 instancias contra 10 en posiciones cercanas, la exactitud global sube a 95,5 % (así la redondea la barra de estado; la pestaña Resumen muestra 95,45 %, que son 105 aciertos de 110), pero la de la clase pequeña cae a 50 %, porque la clase grande genera casi todas las correcciones y arrastra el plano. Por eso el simulador reporta también la <span class="resaltado">exactitud de cada clase</span> (F18): la global, sola, haría creer que el modelo mejoró.</p>
<p>La tasa de aprendizaje no cambia si el problema es separable o no, pero sí cambia cómo se comporta el plano. Una tasa grande produce saltos bruscos, y una pequeña produce movimientos suaves que tardan más épocas. En clasificación con escalón, si los pesos empezaran en cero la tasa solo cambiaría su escala y no las decisiones; pero en tu código empiezan al azar entre −1 y 1, así que la tasa decide cuánto pesan las correcciones frente a esos pesos iniciales. Con la semilla 7 y las clases separadas, γ = 0,001 necesita 32 épocas, γ = 0,1 necesita 6 y γ = 10 necesita 4; con las clases solapadas, γ = 0,01 deja la exactitud en 53 % (97 % y 9 % por clase) frente a 61,5 % con γ = 0,1. En regresión, como se verá en el módulo 5, una tasa demasiado grande hace que el error explote.</p>`,

<p>En regresión la salida deseada ya no es una etiqueta sino un número real, así que la función escalón se reemplaza por una <b>activación lineal</b>, <code>y = S</code>. Con ese cambio, la misma regla de ajuste <code>wi ← wi + γ·(d − y)·xi</code> se convierte en la regla delta o LMS de Widrow y Hoff (1960), que va reduciendo el error cuadrático instancia por instancia, como un descenso por gradiente estocástico. El perceptrón aprende entonces el plano (o hiperplano) que mejor sigue a la nube de puntos.</p>

<p>La regla más estricta del curso es que ninguna librería puede hacer la matemática. Por eso <code>formulas.py</code> no importa nada y calcula desde cero hasta las funciones que normalmente se dan por hechas. La <b>raíz cuadrada</b> se obtiene con Newton-Raphson, que aplicado a <code>r² = a</code> da la iteración <code>r ← ½(r + a/r)</code> y converge muy rápido. Mientras r está lejos de la raíz, cada paso apenas divide r a la mitad, y por eso el ciclo admite hasta 1100 pasos: un número tan grande como 10³⁰⁸ necesita unas 520 mitades antes de acercarse, aunque los números normales terminan en pocos pasos. El número <b>π</b> sale de la fórmula de Machin, <code>π = 16·atan(1/5) − 4·atan(1/239)</code>, usando la serie de Taylor de la arcotangente.</p>
<p>El <b>logaritmo natural</b> usa una reducción de rango: el número se escribe como <code>a = m·2^k</code> con <code>1 ≤ m &lt; 2</code>, de modo que <code>ln a = k·ln 2 + ln m</code>, y <code>ln m</code> se calcula con la serie de la arcotangente hiperbólica, que converge rápido cerca de 1. El <b>coseno</b> lleva primero el ángulo al intervalo [−π, π] y luego suma su serie de Taylor. En ambos casos las series se detienen cuando el término es menor que 10⁻¹⁸.</p>
<p>Los números aleatorios vienen de un <b>generador congruencial lineal</b>, <code>X(k+1) = (a·X(k) + c) mod m</code>, con las constantes de <i>Numerical Recipes</i> (a = 1664525, c = 1013904223, m = 2³²). Cada X se convierte en un número uniforme en (0, 1) con <code>U = (X + 0,5)/m</code>, que nunca vale exactamente 0, lo que protege al logaritmo. Sobre esa uniforme se construyen las cuatro distribuciones, todas parametrizadas por media μ y desviación σ.</p>
<div class="formula">F12 Normal (Box-Muller)   Z = √(−2 ln U1) · cos(2π U2) ;  X = μ + σZ
F13 Uniforme             X = (μ − a) + 2a·U ,  a = σ√3
F14 Exponencial (inversa) X = (μ − σ) − σ ln U
F15 Binomial estandarizada X = μ + σ (B − np) / √(np(1 − p))</div>
<p>Solo hay tres <code>import</code> que no son de dibujo, y ninguno hace matemática: <code>time</code> en <code>aleatorio.py</code> toma una semilla distinta cuando el usuario la deja vacía, <code>copy</code> en <code>experimentos.py</code> duplica la configuración para no modificar los valores por defecto, y <code>ctypes</code> en <code>main.py</code> solo ajusta la nitidez de la ventana en Windows. Conviene decirlo antes de que el profesor lo pregunte.</p>
<p>La regla se cumple incluso en los detalles: el proyecto no usa las funciones integradas de Python que calculan, como <code>min</code>, <code>max</code> o <code>sum</code>. En su lugar, <code>formulas.py</code> define <code>minimo</code> y <code>maximo</code> (M7), que comparan valor por valor, y calcula con ciclos la media (F16) y la desviación estándar (F17) con las que se comprueba que cada nube simulada quedó como se pidió. Con el mismo criterio está <code>es_finito</code> (M8), que reconoce un NaN porque es el único valor que no es igual a sí mismo y el infinito comparándolo con <code>float("inf")</code>, sin importar <code>math</code>. Es la misma idea de <code>err != err</code> que usa <code>entrenar</code> para detectar la divergencia, y la aprovechan <code>main.py</code>, para rechazar datos como nan o inf, y <code>graficas.py</code>, para no dibujar un plano con pesos infinitos.</p>`,
  archivo: "formulas.py",
  codigo: String.raw`def raiz_cuadrada(a):
    """M2: Newton-Raphson para r^2 = a:
           r(k+1) = 1/2 * ( r(k) + a / r(k) )
    Se repite hasta que r deja de cambiar.
    Mientras r está lejos de la raíz, cada paso solo divide r a la mitad; un
    número tan grande como 1e308 necesita unas 520 mitades antes de acercarse,
    por eso se permiten hasta 1100 pasos (los números normales terminan en pocos)."""
    if a < 0:
        raise ValueError("No existe raíz cuadrada real de un número negativo")
    if a == 0:
        return 0.0
    r = a if a >= 1 else 1.0
    for _ in range(1100):
        r_nuevo = 0.5 * (r + a / r)
        if valor_absoluto(r_nuevo - r) <= 1e-16 * r_nuevo:
            return r_nuevo
        r = r_nuevo
    return r`,

  { tema: "General", p: "Explíqueme en dos minutos qué hace su proyecto.", r: "Es un simulador del perceptrón escrito en Python que genera nubes de puntos en tres dimensiones con distribuciones de probabilidad propias y entrena perceptrones de una sola neurona para tres tareas: clasificar dos clases, clasificar tres clases con neuronas independientes y ajustar un plano en regresión. Toda la matemática, desde la raíz cuadrada hasta el generador aleatorio, está escrita a mano en formulas.py, y las librerías solo aparecen para dibujar. La interfaz permite cambiar en vivo los parámetros de los datos y del entrenamiento, y muestra las tres gráficas que usted pidió: el espacio 3D con los planos, el error por época y la evolución de los pesos." },
  { tema: "General", p: "¿Cómo demuestra que no usó librerías para la matemática?", r: "Basta revisar los import. formulas.py no importa nada; perceptron.py solo importa formulas.py; aleatorio.py importa formulas.py y time, que solo toma una semilla automática cuando la dejo vacía; experimentos.py importa los módulos propios y copy, que duplica la configuración. Matplotlib y tkinter solo están en graficas.py y main.py, y reciben valores ya calculados: graficas.py dibuja, y main.py usa matplotlib solo para mostrar las figuras dentro de la ventana. El último import, ctypes, en main.py, solo mejora la nitidez de la ventana en Windows." },
  { tema: "General", p: "Cuénteme qué pasa desde que presiono Entrenar hasta que aparece la gráfica.", r: "El botón llama a entrenar_clasificacion de main.py, que lee y valida los campos en _config_clasificacion. Con esa configuración, ejecutar_clasificacion de experimentos.py crea un generador con la semilla, simula los puntos con generar_datos_clasificacion de aleatorio.py y crea el perceptrón con un escalón, con los pesos sorteados entre −1 y 1. Luego entrenar de perceptron.py recorre las épocas: baraja, ajusta cada instancia con F1 a F6 y al final de cada época calcula F7, hasta que converge o se agotan las épocas. Con los pesos finales se calculan la exactitud global y por clase y la media y desviación de cada nube, y todo vuelve a main.py en un diccionario. Por último, graficas.py dibuja el espacio 3D, las épocas y los pesos, y matplotlib solo pinta lo que ya se calculó." },
  { tema: "Teoría", p: "¿Qué es el aprendizaje supervisado y por qué su proyecto lo es?", r: "Es aprender a partir de ejemplos de los que se conoce la respuesta correcta. En mi proyecto cada instancia trae su salida deseada d, que depende de la clase a la que pertenece, o del valor de y en la regresión, y el perceptrón corrige sus pesos según la diferencia entre lo que respondió y esa respuesta, e = d − y. Sin la salida deseada no habría error y la regla no podría aprender." },
  { tema: "Implementación", p: "¿Qué es una distribución de probabilidad y cuáles usó?", r: "Es la descripción de qué valores puede tomar algo al azar y con qué frecuencia. Usé cuatro, todas controladas con la media μ y la desviación σ: la normal, con forma de campana, por Box-Muller; la uniforme, en la que todos los valores de un intervalo son igual de probables, con semiancho σ√3; la exponencial, asimétrica, por transformada inversa; y la binomial, que cuenta éxitos en 20 ensayos y luego se estandariza. Todas parten del número uniforme U que da mi generador congruencial." },
  { tema: "Implementación", p: "¿Por qué usó clases en lugar de solo funciones?", r: "Porque un perceptrón tiene un estado que cambia, sus pesos, θ y sus historiales, y una clase permite guardar ese estado junto con los métodos que lo usan. Así cada objeto Perceptron tiene sus propios pesos, y en uno contra el resto puedo tener tres neuronas independientes sin que se mezclen. Además, la activación es un objeto, Escalon o Lineal, y gracias a su método __call__ la misma clase Perceptron sirve para clasificar y para hacer regresión. Lo mismo vale para GeneradorAleatorio, que guarda el estado X de la secuencia." },
  { tema: "Gráficas", p: "¿Cómo funciona la interfaz por dentro?", r: "Está hecha con tkinter. main() crea la ventana y la Aplicacion arma los widgets: cajas de texto unidas a variables StringVar, listas desplegables, botones y pestañas. Cada botón tiene un command, la función que se ejecuta al pulsarlo, y raiz.mainloop() mantiene la ventana esperando esos eventos. Las gráficas son figuras de matplotlib que FigureCanvasTkAgg muestra dentro de la ventana, y para la animación uso after, que programa el siguiente cuadro sin congelar la interfaz. Nada de eso calcula: todo lo que se muestra viene de experimentos.py y formulas.py." },
  { tema: "Teoría", p: "¿Qué es un perceptrón y quién lo propuso?", r: "Es el modelo más sencillo de neurona artificial: calcula una suma ponderada de sus entradas más un sesgo y la pasa por una función de activación. Lo propuso Frank Rosenblatt en 1958, a partir de la neurona lógica de McCulloch y Pitts, y su aporte fue una regla para aprender los pesos a partir de los errores." },
  { tema: "Teoría", p: "¿Qué papel cumple el sesgo y por qué x0 = −1?", r: "El sesgo permite que el plano no esté obligado a pasar por el origen. Con x0 = −1 la suma queda S = Σwi·xi − θ, de modo que θ actúa como un umbral que se aprende, que es la convención de la clase. Con x0 = +1 se obtiene la forma S = Σwi·xi + b de otros libros. Son equivalentes porque solo cambia el signo del parámetro, y el programa deja elegir cualquiera, usando siempre el mismo x0 en la suma y en el ajuste." },
  { tema: "Teoría", p: "¿Cuál es la diferencia entre el umbral de la función escalón y θ?", r: "El umbral es un valor fijo que el usuario configura y con el que se compara S; θ es un parámetro que el perceptrón aprende. Por defecto el umbral es 0 y θ hace todo el trabajo de desplazar el plano, pero si se cambia el umbral el plano F10 queda como Σwi·xi + θ·x0 = umbral, y el programa lo tiene en cuenta al dibujar." },
  { tema: "Teoría", p: "Explique la regla de aprendizaje.", r: "Para cada instancia se calcula y, se obtiene el error e = d − y y, si es distinto de cero, cada peso se actualiza con wi ← wi + γ·e·xi y el sesgo con θ ← θ + γ·e·x0. La corrección es proporcional a la tasa y a la entrada, y su signo depende del error: si la neurona respondió bajo cuando debía responder alto, los pesos se acercan al punto, y al revés en el caso contrario." },
  { tema: "Teoría", p: "¿Cuándo converge el perceptrón y cuándo no?", r: "El teorema de convergencia de Novikoff garantiza que converge en un número finito de pasos si las clases son linealmente separables. Si se solapan, no existe un plano separador y el error oscila indefinidamente; eso es lo que se ve con el escenario Solapadas, que llegó a 100 épocas sin converger y con 61,5 % de exactitud." },
  { tema: "Teoría", p: "¿Qué limitación tiene el perceptrón?", r: "Solo puede representar fronteras lineales. No resuelve problemas como XOR ni clases que se entrelazan, que fue lo que señalaron Minsky y Papert en 1969. En el proyecto se ve tanto en clasificación, con las clases solapadas, como en regresión, con el modelo cuadrático, donde el ECM sube de 1,08 a 81,5 porque el plano no puede seguir la curvatura." },
  { tema: "Implementación", p: "Muéstreme dónde está la suma ponderada y explíquela.", r: "Está en suma_ponderada de formulas.py. Inicia S en cero, recorre los pesos con un for acumulando w[i]·x[i] y al final suma θ·x0. La llama el método suma de la clase Perceptron, y la usan tanto el entrenamiento como la predicción y el dibujo de los planos." },
  { tema: "Implementación", p: "¿Cómo calcula el error de cada época?", r: "Al terminar la época, error_conjunto recorre de nuevo todas las instancias con los pesos ya ajustados, calcula el error de cada una y aplica F7, err = ½·Σe². Es la «repasadita» de la clase. Ese valor se guarda en historial_error y es el que se dibuja en la gráfica de épocas, con la época 0 correspondiente a los pesos iniciales." },
  { tema: "Implementación", p: "¿Cómo inicializa los pesos?", r: "En el constructor de Perceptron, cada peso y el sesgo se toman uniformes en (−1, 1) con el generador propio, que equivale al w ← rand() del pseudocódigo. En el ejemplo de clase, en cambio, se cargan los pesos de las diapositivas para reproducir las mismas cuentas." },

  id: "suma",
  titulo: "Multiplicar y sumar: la suma ponderada",
  html: `
<p>«Ponderar» significa dar a cada cosa un peso según su importancia. Ya conoces una suma ponderada aunque no la llames así: si la nota final de un curso es 30 % del primer parcial, 30 % del segundo y 40 % del final, y sacaste 3,0, 4,0 y 5,0, tu nota es</p>
<div class="formula">nota = 0,3·3,0 + 0,3·4,0 + 0,4·5,0 = 0,9 + 1,2 + 2,0 = 4,1</div>
<p>Cada nota se multiplica por su peso y los resultados se suman. El perceptrón hace exactamente eso con las tres coordenadas del punto: multiplica cada entrada por su peso y suma. La diferencia es que sus pesos no los fija nadie; empiezan siendo números al azar entre −1 y 1 y el entrenamiento los va corrigiendo. Además, un peso puede ser negativo, lo que quiere decir que esa entrada empuja la suma hacia abajo en lugar de hacia arriba.</p>
<div class="formula">F1  S = w1·x1 + w2·x2 + w3·x3 + θ·x0</div>
<p>El último término, <code>θ·x0</code>, es el <b>sesgo</b>. Puedes pensarlo como un peso más cuya entrada vale siempre lo mismo, <code>x0 = −1</code> en la convención de la clase. Como θ por −1 es −θ, la fórmula queda <code>S = w1·x1 + w2·x2 + w3·x3 − θ</code>: el sesgo le resta a la suma una cantidad que también se aprende. Sin él la frontera que traza la neurona tendría que pasar siempre por el punto (0, 0, 0), y eso la limitaría muchísimo.</p>
<p>La letra griega <b>Σ</b> (sigma mayúscula) es una abreviatura para «sumar todos». Cuando leas <code>Σwi·xi</code>, tradúcelo como «multiplicar cada peso por su entrada y sumar todo», es decir, <code>w1·x1 + w2·x2 + w3·x3</code>. La <code>i</code> es solo un contador que va pasando por 1, 2 y 3.</p>
<p>Una vez calculada S, la neurona decide. En clasificación compara S con el <b>umbral</b> (por defecto 0): si S es mayor o igual responde la salida alta (1) y si no, la baja (−1). Eso es la <b>función escalón</b>, F2, y se llama así porque al dibujarla parece un escalón: vale −1 y de repente salta a 1. Por ejemplo, con w = (1, 1), θ = 0 y el punto x = (2, 1), la suma es S = 1·2 + 1·1 + 0·(−1) = 3; como 3 ≥ 0, la neurona responde 1.</p>`,

    S = S + theta * x0
    return S`,

  titulo: "Rectas, planos y los dos lados",
  html: `
<p>Ahora viene la idea geométrica que hace entendible todo el proyecto. Toma una neurona con dos entradas y pregúntate en qué puntos la suma vale exactamente el umbral, es decir, <code>w1·x1 + w2·x2 − θ = 0</code>. Esa ecuación describe una <b>recta</b>. Por ejemplo, con w = (1, 1) y θ = 3 la ecuación es <code>x1 + x2 − 3 = 0</code>, y la cumplen puntos como (3, 0), (0, 3) o (1,5; 1,5): todos están sobre la misma línea.</p>
<p>Lo importante es lo que pasa fuera de la recta. Para el punto (3, 2) la suma vale 3 + 2 − 3 = 2, positiva; para el punto (0, 0) vale 0 + 0 − 3 = −3, negativa. Todos los puntos de un lado de la recta dan S positiva y todos los del otro dan S negativa. Por eso la recta es una <b>frontera de decisión</b>: el escalón responde la salida alta a un lado y la baja al otro. Clasificar, para el perceptrón, no es más que preguntar de qué lado de su frontera cae un punto.</p>
<p>Con tres entradas pasa lo mismo, pero la ecuación <code>w1·x1 + w2·x2 + w3·x3 + θ·x0 = umbral</code> ya no es una recta sino un <b>plano</b>, una lámina plana dentro del espacio 3D. Esa es la fórmula F10 y es el plano que ves en la gráfica. Si hubiera cuatro o más entradas sería un «hiperplano», que no se puede dibujar pero funciona igual; por eso en la regresión con tres entradas la gráfica muestra solo un corte.</p>
<p>Los números controlan la frontera de una forma muy concreta. Cambiar los pesos <b>gira</b> la recta o el plano, porque cambia su inclinación, y cambiar θ la <b>desplaza</b> sin girarla, paralela a sí misma. Entrenar consiste entonces en girar y mover la frontera hasta que cada clase quede de su lado. Prueba la demostración de abajo: mueve los controles, toca el lienzo para poner un punto y mira cómo cambian S y el lado.</p>
<p>Para dibujar la frontera hay que <b>despejar</b> una coordenada, por ejemplo <code>x2 = (θ − w1·x1) / w2</code>, y eso obliga a dividir entre un peso. Si ese peso es casi cero la división se dispara, y por eso <code>graficas.py</code> despeja siempre la coordenada cuyo peso tiene el mayor valor absoluto. La función que hace el despeje es <code>coordenada_del_plano</code>.</p>`,

  html: `
<p>La <b>media</b> (F16) es el promedio de siempre: se suman los valores y se divide entre cuántos son. Para 3, 4 y 5 la media es (3 + 4 + 5)/3 = 4. En tu proyecto se calcula una media por coordenada, y las tres medias juntas forman el <b>centroide</b> de la nube, el punto que el espacio 3D marca con una X.</p>
<p>La <b>desviación estándar</b> σ (F17) mide qué tan lejos de la media suelen quedar los valores. Se calcula en cuatro pasos: restar la media a cada valor, elevar cada diferencia al cuadrado (para que las negativas no cancelen a las positivas), promediar esos cuadrados y sacar la raíz. Con 3, 4 y 5 las diferencias son −1, 0 y 1, sus cuadrados 1, 0 y 1, su promedio 2/3 ≈ 0,667 y la raíz 0,816. El promedio de los cuadrados, antes de la raíz, se llama <b>varianza</b> y vale σ². Tu código divide entre N, el número de valores, como dice F17.</p>
<div class="formula">F16  media = (x1 + x2 + … + xN) / N
F17  σ = √[ ((x1 − media)² + … + (xN − media)²) / N ]</div>
<p>Una <b>distribución de probabilidad</b> describe qué valores puede tomar algo al azar y con qué frecuencia. Si sorteas muchísimos valores y haces un <b>histograma</b>, un gráfico de barras que cuenta cuántos cayeron en cada tramo, la forma de las barras es la forma de la distribución. Tu proyecto tiene cuatro, y todas se controlan con los mismos dos números, la media μ y la desviación σ, para que la interfaz sea igual para cualquiera de ellas:</p>
<ul class="lista-errores">
<li><b>Normal</b> (F12): la famosa campana. La mayoría de valores cae cerca de la media y cada vez menos lejos de ella, igual a ambos lados; así se reparten, por ejemplo, las estaturas de las personas. Es la distribución por defecto de las clases y del ruido.</li>
<li><b>Uniforme</b> (F13): todos los valores de un intervalo son igual de probables, como la ruleta. Con media μ y desviación σ, el intervalo va de μ − σ√3 a μ + σ√3, y nada cae fuera de él. Es la distribución por defecto de las entradas de la regresión.</li>
<li><b>Exponencial</b> (F14): describe tiempos de espera, como cuánto tarda en llegar el próximo bus. Es asimétrica: nunca baja de μ − σ, se amontona cerca de ese mínimo y tiene una cola larga hacia valores grandes. Por eso el escenario Solapadas la usa en la clase 2: esa clase está por encima de la clase 1, así que el montón cercano al mínimo se corre hacia la clase 1 y la invade, mientras la cola se aleja hacia afuera.</li>
<li><b>Binomial</b> (F15): cuenta éxitos en ensayos repetidos, como cuántas caras salen al lanzar una moneda 20 veces. Tu código usa 20 ensayos con probabilidad 0,5 y luego la estandariza para que tenga media μ y desviación σ. Como el número de caras es un entero entre 0 y 20, cada coordenada solo puede tomar a lo sumo 21 valores distintos, así que la nube queda como una rejilla de puntos.</li>
</ul>
<p>El <b>ruido</b> de la regresión es un valor al azar, normal con media 0, que se suma a cada y para imitar los errores de medición del mundo real. Por culpa de ese ruido ningún plano puede pasar exactamente por todos los puntos, y por eso el error de la regresión nunca llega a cero. Usa la demostración de abajo para ver la forma de cada distribución y comprobar que la media y la desviación obtenidas quedan cerca de las pedidas, igual que lo comprueba el resumen de tu programa.</p>`,

{
  id: "azar",
  titulo: "Azar hecho a mano",
  html: `
<p>Una computadora es una máquina obediente: con las mismas instrucciones y los mismos datos da siempre el mismo resultado. Por eso no puede producir azar verdadero, y lo que hace es fabricar números <b>pseudoaleatorios</b>: una secuencia calculada con una regla fija, pero tan revuelta que para cualquier uso práctico parece al azar. Como la regla prohíbe la librería <code>random</code>, tu proyecto tiene su propio fabricante, la clase <code>GeneradorAleatorio</code> de <code>aleatorio.py</code>.</p>
<p>La regla que usa es el <b>generador congruencial lineal</b> (F11), que necesita la operación <b>mod</b>, el residuo de una división. Un reloj es el mejor ejemplo: 13 horas después de las 12 son la 1, porque 13 mod 12 = 1. La regla toma el número anterior X, lo multiplica por a = 1664525, le suma c = 1013904223 y se queda con el residuo de dividir entre m = 2³² = 4 294 967 296:</p>
<div class="formula">F11  X(nuevo) = (a·X + c) mod m        U = (X + 0,5) / m</div>
<p>El primer X es la <b>semilla</b>. Con la semilla 7 la primera cuenta da (1664525·7 + 1013904223) mod 2³² = 1 025 555 898, que dividido entre m da U = 0,238781; la siguiente da X = 3 923 423 697 y U = 0,913493. Cada U es un número entre 0 y 1, la materia prima de todo lo demás. El 0,5 sumado a X garantiza que U nunca sea exactamente 0, lo que importa porque después se le saca logaritmo y el logaritmo de 0 no existe. Puedes comprobar estas cuentas en la demostración de abajo.</p>
<p>Como la secuencia depende solo de la semilla, <span class="resaltado">la misma semilla produce siempre los mismos datos, los mismos pesos iniciales y el mismo orden de barajado</span>. Eso hace que un experimento sea <b>reproducible</b>, y es la razón por la que el informe usa la semilla 7: si la escribes en la interfaz verás exactamente los mismos resultados. Si dejas la semilla vacía, el constructor toma la hora del reloj en nanosegundos con <code>time.time_ns()</code>, que es el único uso de la librería <code>time</code>, y cada ejecución sale distinta.</p>
<p>A partir de U se fabrica todo. <code>uniforme(a, b)</code> estira U al intervalo deseado con a + (b − a)·U, y así se sortean los pesos iniciales entre −1 y 1. <code>entero(n)</code> multiplica U por n y le quita los decimales para obtener un entero entre 0 y n − 1. <code>barajar</code> usa el algoritmo de <b>Fisher-Yates</b>, que es como barajar cartas de forma justa: empieza por la última posición, la intercambia con una posición al azar entre las que quedan (incluida ella misma) y repite hacia el principio. Con un generador nuevo con semilla 7, la lista [0, 1, 2, 3, 4] queda como [0, 2, 4, 3, 1]. Las distribuciones normal, exponencial y binomial de la lección anterior también se construyen a partir de U.</p>`,

<p>Piensa en cómo regulas el agua de una ducha. Abres la llave, pruebas, y si sale demasiado fría giras hacia el lado caliente; si te pasas, giras de vuelta. Cada corrección depende de dos cosas: hacia dónde te equivocaste y qué tanto. El perceptrón aprende exactamente así, y la regla de aprendizaje es la versión precisa de esa idea.</p>

  html: `
<p>Un procesador solo sabe sumar, restar, multiplicar, dividir y comparar. Funciones como la raíz cuadrada, el logaritmo o el coseno no vienen «de fábrica»: alguien tiene que escribir una receta que las calcule con esas operaciones básicas. Normalmente esas recetas vienen en la librería <code>math</code>, pero como la regla del curso la prohíbe, tu <code>formulas.py</code> trae las suyas. Las necesitas porque Box-Muller usa raíz, logaritmo, coseno y π, y la exponencial usa logaritmo.</p>
<p>La primera técnica es la <b>iteración</b>: repetir una misma regla hasta que el resultado deja de cambiar. La raíz cuadrada (M2) usa el método de <b>Newton-Raphson</b>, que para √a repite r ← ½·(r + a/r). La idea se entiende sin cálculo: si r es demasiado grande, a/r queda demasiado pequeño, y el promedio de los dos cae en medio, más cerca de la raíz. Para √9 empezando en r = 9 los valores son 5; 3,4; 3,0235; 3,00009; 3,0000000014 y 3, y en el paso siguiente, el séptimo, r ya no cambia y el ciclo se detiene. Fíjate en que cerca de la respuesta los ceros después de la coma se duplican en cada paso; eso se llama convergencia cuadrática.</p>
<p>La segunda técnica son las <b>series</b>: escribir una función como una suma infinita de términos que se van haciendo cada vez más pequeños, y sumar hasta que el término siguiente sea despreciable. El coseno (M6) usa la serie de Taylor:</p>
<div class="formula">cos t = 1 − t²/2! + t⁴/4! − t⁶/6! + …      (cos 1 ≈ 0,5403)</div>
<p>Tu código deja de sumar cuando el término es menor que 10⁻¹⁸, mucho más pequeño que lo que se nota en un resultado. Con el mismo espíritu, la arcotangente (M3) es una serie, y π (M4) se obtiene con la fórmula de Machin, π = 16·atan(1/5) − 4·atan(1/239), que combina dos arcotangentes que convergen muy rápido. El logaritmo (M5) usa un truco previo, la <b>reducción de rango</b>: divide o multiplica el número por 2 hasta dejarlo entre 1 y 2, porque cerca de 1 la serie converge rápido, y después suma tantas veces ln 2 como divisiones hizo. Así, por ejemplo, ln 10 da 2,302585.</p>
<p>No necesitas recordar las series de memoria. Lo que sí debes poder explicar es la idea: ninguna librería calcula por ti, cada función es una repetición de sumas, productos y comparaciones que se detiene cuando el resultado ya no cambia de forma apreciable. Las funciones más sencillas siguen la misma filosofía: <code>valor_absoluto</code> le quita el signo a un número con un if, y <code>minimo</code> y <code>maximo</code> recorren una lista recordando el menor o el mayor que han visto.</p>`,

<p>Python es el lenguaje en que está escrito el proyecto, y un programa en Python es una lista de instrucciones que la computadora ejecuta de arriba hacia abajo. Esta lección y la siguiente explican todo lo que necesitas para leer tu código, con ejemplos sacados de él.</p>
<h3>Variables y tipos</h3>
<p>Una <b>variable</b> es un nombre que guarda un valor. La línea <code>S = 0.0</code> crea la variable S y le guarda el número cero; el signo <code>=</code> en Python significa «guardar», no «es igual», y para comparar se usa <code>==</code> (igual) o <code>!=</code> (distinto). Los valores tienen <b>tipos</b>: <code>int</code> para enteros como 100, <code>float</code> para números con decimales como 0.1 (Python usa punto decimal), <code>str</code> para textos entre comillas como "normal", <code>bool</code> para <code>True</code> o <code>False</code>, y <code>None</code>, que significa «nada», como la semilla cuando el campo queda vacío.</p>
<p>Los operadores son los esperados, <code>+ − * /</code>, más tres que conviene conocer: <code>**</code> es la potencia (<code>2 ** 32</code> es 2³²), <code>%</code> es el residuo, es decir, el mod de F11, y <code>+=</code> es una abreviatura: <code>k += 1</code> significa <code>k = k + 1</code>.</p>
<h3>Listas, tuplas y diccionarios</h3>
<p>Una <b>lista</b> guarda varios valores en orden, entre corchetes: <code>[2.0, 2.0, 2.0]</code>. A cada elemento se accede por su posición, su <b>índice</b>, y aquí hay una trampa: <span class="resaltado">los índices empiezan en 0</span>. Por eso en el código <code>w[0]</code> es w1, <code>w[1]</code> es w2 y <code>w[2]</code> es w3, y las clases 1, 2 y 3 son internamente 0, 1 y 2. Los índices negativos cuentan desde el final: <code>fila[-1]</code> es el último elemento. Una <b>rebanada</b> toma un trozo: <code>historial_error[-20:]</code> son los últimos 20, <code>historial_error[:-20]</code> son todos menos los últimos 20, y <code>self.w[:]</code> es una copia completa. Las listas crecen con <code>append</code> (agrega un elemento) y <code>extend</code> (agrega varios), y <code>len(lista)</code> dice cuántos elementos tienen.</p>
<p>Una <b>tupla</b> es como una lista pero entre paréntesis y sin cambios. Su uso más común es devolver o recibir varios valores a la vez: <code>S, y, e = self.ajustar(X[i], d[i])</code> guarda en tres variables los tres valores que devuelve ajustar, y <code>lista[i], lista[j] = lista[j], lista[i]</code> intercambia dos elementos en una sola línea. Un <b>diccionario</b> guarda pares clave-valor entre llaves y se consulta por nombre en lugar de por posición: <code>config["tasa"]</code> da la tasa de la configuración.</p>
<h3>Decisiones y bloques</h3>
<p><code>if</code> ejecuta un bloque solo si se cumple una condición; <code>elif</code> («si no, si») prueba otra condición, y <code>else</code> cubre el resto. Las condiciones se combinan con <code>and</code>, <code>or</code> y <code>not</code>. En Python <b>la sangría define los bloques</b>: las líneas que están corridas hacia la derecha debajo de un if, un for o un def pertenecen a él. Por eso la sangría no es decoración, y un espacio de más o de menos cambia el programa.</p>
<h3>Ciclos</h3>
<p><code>for</code> repite un bloque para cada elemento de algo. <code>range</code> produce enteros: <code>range(3)</code> da 0, 1 y 2 (sin incluir el 3); <code>range(1, max_epocas + 1)</code> da 1, 2, …, max_epocas, que es como se cuentan las épocas; y <code>range(len(lista) - 1, 0, -1)</code> cuenta hacia atrás, como en Fisher-Yates. Cuando el contador no se necesita se usa el nombre <code>_</code>, como en <code>for _ in range(n)</code>. <code>while</code> repite mientras una condición sea verdadera; <code>while True</code> repite «para siempre» hasta que un <code>return</code> o un <code>break</code> lo corte, que es como terminan las series. <code>break</code> sale del ciclo en el acto, y así se detiene el entrenamiento al converger.</p>
<p>Dos ayudantes aparecen en todo el proyecto. <code>zip(X, etiquetas)</code> recorre dos listas en paralelo, de a pares, y <code>enumerate(lista)</code> entrega cada elemento junto con su posición. Por último, una <b>comprensión de lista</b> construye una lista en una línea: <code>[x for x, c in zip(X, etiquetas) if c != 0]</code> se lee «la lista de cada x cuya etiqueta c no sea 0», y así arma la cascada los datos de P2.</p>`,

  titulo: "Python II: funciones, clases y archivos",
  html: `
<h3>Funciones</h3>
<p>Una <b>función</b> es un bloque de código con nombre que recibe datos, hace algo y devuelve un resultado. Se define con <code>def</code>, los datos que recibe se llaman <b>parámetros</b> y el resultado se entrega con <code>return</code>. Por ejemplo, <code>def error_instancia(d, y): return d - y</code> recibe d e y y devuelve su diferencia. Un parámetro puede tener un <b>valor por defecto</b>, como <code>max_epocas=100</code> en entrenar, que se usa si quien llama no da otro. Al llamar una función se pueden pasar los datos por nombre, <code>max_epocas=config["max_epocas"]</code>, y el atajo <code>**parametros</code> reparte un diccionario completo como argumentos con nombre; así la cascada le pasa la misma configuración a P1 y a P2.</p>
<p>El texto entre triples comillas que sigue a un def es el <b>docstring</b>, la documentación de la función, donde tú escribiste cada fórmula con su código. Lo que va después de <code>#</code> es un <b>comentario</b>, que Python ignora. Una <code>lambda</code> es una función pequeña sin nombre, escrita en una línea; la interfaz las usa para decirle a un botón qué hacer, como <code>lambda: self._mover_medias(0.75)</code>.</p>
<h3>Clases y objetos</h3>
<p>Una <b>clase</b> es un molde, y un <b>objeto</b> es una cosa fabricada con ese molde. La clase <code>Perceptron</code> describe qué tiene toda neurona (pesos, θ, tasa, historiales) y qué sabe hacer (sumar, predecir, ajustar, entrenar); cada vez que el código escribe <code>Perceptron(...)</code> fabrica una neurona nueva con sus propios pesos. Por eso en uno contra el resto hay tres objetos y sus pesos no se mezclan: cada uno guarda los suyos. Ojo con una palabra: en programación a un objeto también se le llama «instancia de la clase», que no tiene nada que ver con las instancias de datos; en la sustentación conviene decir «objeto» para no confundir.</p>
<p>Dentro de una clase, <code>__init__</code> es el <b>constructor</b>, la función que se ejecuta al fabricar el objeto y le da sus valores iniciales. <code>self</code> es la forma en que el objeto se refiere a sí mismo: <code>self.w</code> son «mis pesos». Las variables guardadas en self se llaman <b>atributos</b> (como <code>self.gamma</code> o <code>self.convergio</code>) y las funciones de la clase se llaman <b>métodos</b> (como <code>self.suma(x)</code>). Un método especial, <code>__call__</code>, permite usar un objeto como si fuera una función: como Escalon lo tiene, el perceptrón puede escribir <code>self.activacion(S)</code> sin saber si su activación es un escalón o una lineal. Ese es el truco que permite que la misma clase Perceptron sirva para clasificar y para hacer regresión.</p>
<h3>Archivos, import y errores</h3>
<p>Cada archivo .py es un <b>módulo</b>, y <code>from formulas import suma_ponderada</code> trae una función de otro archivo para poder usarla. Leyendo los import se ve quién depende de quién, y por eso tu proyecto se puede demostrar «sin librerías» solo mirando las primeras líneas de cada archivo.</p>
<p>Cuando algo sale mal, el código puede <b>lanzar una excepción</b> con <code>raise ValueError("mensaje")</code>, que interrumpe lo que se estaba haciendo. Quien llamó puede <b>atraparla</b> con <code>try: … except ValueError as error: …</code> y reaccionar, en lugar de que el programa se caiga. Así funciona la validación: <code>leer_tasa</code> lanza el error si γ ≤ 0, y <code>_ejecutar</code> lo atrapa y muestra el mensaje en una ventana. El bloque <code>finally</code> se ejecuta pase lo que pase, y ahí se devuelve el cursor del mouse a la normalidad.</p>

<p>Las dos únicas librerías externas del proyecto se encargan de lo que se ve. <b>tkinter</b> construye la ventana, y viene incluida con Python; <b>matplotlib</b> dibuja las gráficas, y es la única que se instala aparte (por eso es la única línea de requirements.txt). Ninguna calcula nada del perceptrón: reciben números ya calculados por tus funciones y los muestran.</p>
<h3>Cómo funciona una interfaz</h3>
<p>Una interfaz gráfica está hecha de piezas llamadas <b>widgets</b>. En main.py, <code>tk.Tk()</code> crea la ventana principal, a la que el código llama <code>raiz</code>, y dentro van las piezas: <code>Label</code> (un texto), <code>Entry</code> (una caja para escribir), <code>Button</code> (un botón), <code>Combobox</code> (una lista desplegable, como la de distribuciones), <code>Radiobutton</code> (elegir una opción, como 2 o 3 clases), <code>Checkbutton</code> (una casilla, como Barajar), <code>Notebook</code> (pestañas), <code>Frame</code> y <code>LabelFrame</code> (recuadros para agrupar) y <code>Scale</code> (la barra deslizante de Época mostrada). Las piezas se acomodan con <code>pack</code>, que las apila, o con <code>grid</code>, que las pone en filas y columnas. Cada caja de texto está unida a una variable especial, <code>StringVar</code>, de la que se lee con <code>.get()</code> y en la que se escribe con <code>.set()</code>.</p>
<p>La idea más importante es la <b>programación por eventos</b>. El programa no corre de arriba abajo y termina: después de armar la ventana, <code>raiz.mainloop()</code> se queda esperando a que pase algo, como un clic. Cada botón tiene un <code>command</code>, la función que se ejecuta al pulsarlo; por ejemplo, el botón ENTRENAR CLASIFICACIÓN tiene <code>command=self.entrenar_clasificacion</code>. Para la animación se usa <code>raiz.after(espera, función)</code>, que programa una función para dentro de unos milisegundos sin congelar la ventana. Los mensajes de error salen con <code>messagebox.showerror</code>.</p>
<h3>Cómo se dibuja una gráfica</h3>
<p>En matplotlib una <code>Figure</code> es la hoja en blanco y <code>add_subplot</code> crea dentro unos <b>ejes</b>, el área con su escala; con <code>projection="3d"</code> los ejes son tridimensionales. Sobre los ejes se dibuja: <code>scatter</code> pone puntos (las nubes, la X del centroide y la estrella del punto nuevo), <code>plot</code> traza líneas (el error por época y los pesos), y <code>Poly3DCollection</code> pinta un polígono en 3D, que es como se dibuja el plano después de que tus funciones calcularon sus esquinas. <code>legend</code>, <code>set_xlabel</code> y <code>set_title</code> ponen la leyenda, los nombres de los ejes y el título.</p>
<p>Para que las gráficas aparezcan dentro de la ventana, <code>FigureCanvasTkAgg</code> convierte la figura de matplotlib en un widget de tkinter, y <code>NavigationToolbar2Tk</code> agrega la barra de zoom, mover y guardar imagen. Cada vez que algo cambia, el código borra la figura con <code>fig.clear()</code>, vuelve a dibujar y pide actualizarla con <code>canvas.draw_idle()</code>. Un detalle de eficiencia: <code>_redibujar_visible</code> solo redibuja la pestaña que estás mirando, y las demás quedan anotadas en <code>self.pendientes</code> hasta que las abras.</p>`,

/* =====================================================================
   ESTADO Y PERSISTENCIA
   El avance se guarda en localStorage del navegador. Toda lectura y
   escritura va dentro de try/catch porque el almacenamiento puede no estar
   disponible; en ese caso la app funciona igual, solo que sin recordar.
   ===================================================================== */
const CLAVE = "estudio-perceptron-v1";
const estadoInicial = () => ({ fundamentos: {}, modulos: {}, niveles: [0, 0, 0], repasadas: {} });
let estado = estadoInicial();
try {
  const guardado = localStorage.getItem(CLAVE);
  if (guardado) estado = Object.assign(estadoInicial(), JSON.parse(guardado));
} catch (e) { /* sin almacenamiento: se usa el estado en memoria */ }

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {}
  actualizarProgreso();
}

/* Avance general: 25 % lecciones desde cero, 25 % módulos, 35 % niveles aprobados,
   15 % preguntas repasadas */
function actualizarProgreso() {
  const f = FUNDAMENTOS.filter(l => estado.fundamentos[l.id]).length / FUNDAMENTOS.length;
  const m = Object.keys(estado.modulos).length / MODULOS.length;
  const n = estado.niveles.filter(p => p >= 70).length / NIVELES.length;
  const s = Math.min(1, Object.keys(estado.repasadas).length / SUSTENTACION.length);
  const pct = Math.round((f * 0.25 + m * 0.25 + n * 0.35 + s * 0.15) * 100);
  document.getElementById("pctGeneral").textContent = pct + " %";
  document.getElementById("barraGeneral").style.width = pct + "%";
}

const $ = (sel, raiz = document) => raiz.querySelector(sel);
function el(etiqueta, atributos = {}, html = "") {
  const nodo = document.createElement(etiqueta);
  for (const [k, v] of Object.entries(atributos)) {
    if (k.startsWith("on")) nodo.addEventListener(k.slice(2), v);
    else nodo.setAttribute(k, v);
  }
  if (html) nodo.innerHTML = html;
  return nodo;
}
const escapar = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* Números al estilo colombiano: coma decimal */
const fmt = (v, d = 5) => Number(v).toFixed(d).replace(".", ",");
const leerNumero = t => parseFloat(String(t).trim().replace(",", "."));

/* Resaltado de sintaxis mínimo para Python. Una sola expresión regular con
   alternativas evita que un patrón coloree dentro de lo que ya coloreó otro. */
const PALABRAS = "def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|import|from|as|raise|break|lambda|self";
function resaltarPython(codigo) {
  const patron = new RegExp(`("""[\\s\\S]*?"""|"[^"\\n]*"|'[^'\\n]*')|(#[^\\n]*)|\\b(${PALABRAS})\\b|\\b(\\d+\\.?\\d*(?:e-?\\d+)?)\\b`, "g");
  let salida = "", ultimo = 0, m;
  while ((m = patron.exec(codigo)) !== null) {
    salida += escapar(codigo.slice(ultimo, m.index));
    const t = escapar(m[0]);
    if (m[1]) salida += `<span class="st">${t}</span>`;
    else if (m[2]) salida += `<span class="cm">${t}</span>`;
    else if (m[3]) salida += `<span class="kw">${t}</span>`;
    else salida += `<span class="nu">${t}</span>`;
    ultimo = patron.lastIndex;
  }
  return salida + escapar(codigo.slice(ultimo));
}

/* =====================================================================
   DEMO: PERCEPTRÓN EN VIVO SOBRE UN LIENZO 2D
   Es el mismo algoritmo del proyecto en dos dimensiones: suma ponderada con
   x0 = −1, escalón con salidas 1 / −1 y la regla wi ← wi + γ·e·xi. Cada
   cuadro de animación procesa una instancia; al terminar el recorrido se
   calcula el error de la época (F7) como en perceptron.py.
   ===================================================================== */
function crearLienzo(contenedor, { escenario = "separadas", leyenda = "" } = {}) {
  const caja = el("div", { class: "lienzo-vivo" });
  const canvas = el("canvas", { width: 960, height: 540, "aria-label": "Perceptrón entrenando en dos dimensiones" });
  const lectura = el("div", { class: "lectura" });
  const botones = el("div", { class: "fila-botones" });
  caja.append(canvas, lectura);
  if (leyenda) caja.appendChild(el("p", { class: "leyenda-lienzo" }, leyenda));
  caja.appendChild(botones);
  contenedor.appendChild(caja);

  const ctx = canvas.getContext("2d");
  const GAMMA = 0.1, X0 = -1;
  let puntos = [], w = [0, 0], theta = 0, epoca = 0, errores = [], orden = [], paso = 0;
  let corriendo = false, idAnim = null, claseNueva = 1, estadoTexto = "listo";

  // Generador congruencial propio, igual que en aleatorio.py, para que la demo
  // tampoco dependa de Math.random.
  let X = 12345;
  const U = () => { X = (1664525 * X + 1013904223) % 4294967296; return (X + 0.5) / 4294967296; };
  const normal = (mu, s) => mu + s * Math.sqrt(-2 * Math.log(U())) * Math.cos(2 * Math.PI * U());

  function generar(tipo) {
    puntos = [];
    const sep = tipo === "separadas";
    const cA = sep ? [-0.45, -0.3] : [-0.12, -0.05], cB = sep ? [0.45, 0.35] : [0.12, 0.08];
    const s = sep ? 0.15 : 0.28;
    for (let i = 0; i < 40; i++) puntos.push({ x: [normal(cA[0], s), normal(cA[1], s)], d: 1 });
    for (let i = 0; i < 40; i++) puntos.push({ x: [normal(cB[0], s), normal(cB[1], s)], d: -1 });
    reiniciarPesos();
  }
  function reiniciarPesos() {
    w = [U() * 2 - 1, U() * 2 - 1]; theta = U() * 2 - 1;
    epoca = 0; errores = []; paso = 0; nuevoOrden(); estadoTexto = "listo"; dibujar();
  }
  function nuevoOrden() {   // Fisher-Yates
    orden = puntos.map((_, i) => i);
    for (let i = orden.length - 1; i > 0; i--) { const j = Math.floor(U() * (i + 1)); [orden[i], orden[j]] = [orden[j], orden[i]]; }
  }
  const S = x => w[0] * x[0] + w[1] * x[1] + theta * X0;          // F1
  const y = x => (S(x) >= 0 ? 1 : -1);                             // F2
  function errorEpoca() { let s = 0; for (const p of puntos) { const e = p.d - y(p.x); s += e * e; } return 0.5 * s; }  // F7

  function unPaso() {
    if (!puntos.length) return;
    const p = puntos[orden[paso]];
    const e = p.d - y(p.x);                                          // F4
    if (e !== 0) {
      w[0] += GAMMA * e * p.x[0]; w[1] += GAMMA * e * p.x[1];        // F5
      theta += GAMMA * e * X0;                                        // F6
    }
    paso++;
    if (paso >= orden.length) {
      paso = 0; epoca++; const err = errorEpoca(); errores.push(err); nuevoOrden();
      if (err === 0) { estadoTexto = "convergió en " + epoca + (epoca === 1 ? " época" : " épocas"); detener(); }
      else if (epoca >= 150) { estadoTexto = "no convergió (150 épocas)"; detener(); }
      else estadoTexto = "entrenando";
    }
  }

  // Conversión entre coordenadas del modelo [-1, 1] y píxeles
  const W = canvas.width, H = canvas.height, ESC = H / 2.2;
  const aPx = (a, b) => [W / 2 + a * ESC, H / 2 - b * ESC];
  const dePx = (px, py) => [(px - W / 2) / ESC, (H / 2 - py) / ESC];

  function color(nombre) { return getComputedStyle(document.documentElement).getPropertyValue(nombre).trim(); }
  function dibujar() {
    const tinta = color("--tinta"), roja = color("--correccion"), lapiz = color("--lapiz"), hoja = color("--hoja");
    ctx.fillStyle = hoja; ctx.fillRect(0, 0, W, H);
    // cuadrícula
    ctx.strokeStyle = color("--linea"); ctx.lineWidth = 1;
    for (let gx = -2; gx <= 2; gx += 0.25) { const [px] = aPx(gx, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke(); }
    for (let gy = -1.25; gy <= 1.25; gy += 0.25) { const [, py] = aPx(0, gy); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke(); }
    // semiplano de la clase 1, sombreado muy tenue
    if (Math.abs(w[1]) > 1e-9 || Math.abs(w[0]) > 1e-9) {
      ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = tinta;
      for (let px = 0; px < W; px += 12) for (let py = 0; py < H; py += 12) {
        if (y(dePx(px + 6, py + 6)) === 1) ctx.fillRect(px, py, 12, 12);
      }
      ctx.restore();
    }
    // recta de separación F10 en 2D: w1·x1 + w2·x2 − θ = 0
    ctx.strokeStyle = color("--grafito"); ctx.lineWidth = 3;
    if (Math.abs(w[1]) > 1e-9) {
      const x1a = -2.2, x1b = 2.2;
      const [ax, ay] = aPx(x1a, (theta - w[0] * x1a) / w[1]), [bx, by] = aPx(x1b, (theta - w[0] * x1b) / w[1]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    } else if (Math.abs(w[0]) > 1e-9) {
      const [px] = aPx(theta / w[0], 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    }
    // puntos: clase 1 círculos azules, clase 2 cruces rojas; un aro marca los mal clasificados
    for (const p of puntos) {
      const [px, py] = aPx(p.x[0], p.x[1]);
      if (p.d === 1) { ctx.fillStyle = tinta; ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill(); }
      else { ctx.strokeStyle = roja; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px - 6, py - 6); ctx.lineTo(px + 6, py + 6); ctx.moveTo(px + 6, py - 6); ctx.lineTo(px - 6, py + 6); ctx.stroke(); }
      if (y(p.x) !== p.d) { ctx.strokeStyle = lapiz; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, 11, 0, 7); ctx.stroke(); }
    }
    const err = puntos.length ? errorEpoca() : 0;
    lectura.innerHTML = `<span>época <b>${epoca}</b></span><span>err (F7) <b>${fmt(err, 1)}</b></span>` +
      `<span>w1 <b>${fmt(w[0], 3)}</b></span><span>w2 <b>${fmt(w[1], 3)}</b></span><span>θ <b>${fmt(theta, 3)}</b></span><span>estado <b>${estadoTexto}</b></span>`;
  }
  function bucle() {
    for (let k = 0; k < 6 && corriendo; k++) unPaso();
    dibujar();
    if (corriendo) idAnim = requestAnimationFrame(bucle);
  }
  function iniciar() { if (corriendo) return; corriendo = true; estadoTexto = "entrenando"; btnEntrenar.textContent = "Pausar"; bucle(); }
  function detener() { corriendo = false; if (idAnim) cancelAnimationFrame(idAnim); btnEntrenar.textContent = "Entrenar"; dibujar(); }

  const btnEntrenar = el("button", { class: "boton", onclick: () => (corriendo ? detener() : iniciar()) }, "Entrenar");
  const btnClase = el("button", { class: "boton secundario", onclick: () => { claseNueva = -claseNueva; btnClase.textContent = claseNueva === 1 ? "Al tocar: clase 1 (círculo)" : "Al tocar: clase 2 (cruz)"; } }, "Al tocar: clase 1 (círculo)");
  botones.append(
    btnEntrenar,
    el("button", { class: "boton secundario", onclick: () => { detener(); reiniciarPesos(); } }, "Pesos nuevos"),
    el("button", { class: "boton secundario", onclick: () => { detener(); generar("separadas"); } }, "Separadas"),
    el("button", { class: "boton secundario", onclick: () => { detener(); generar("solapadas"); } }, "Solapadas"),
    btnClase
  );
  canvas.addEventListener("pointerdown", ev => {
    const r = canvas.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width), py = (ev.clientY - r.top) * (H / r.height);
    puntos.push({ x: dePx(px, py), d: claseNueva });
    epoca = 0; errores = []; paso = 0; nuevoOrden(); estadoTexto = "punto agregado"; dibujar();
  });
  generar(escenario);
  const control = { detener };
  lienzosActivos.push(control);
  return control;
}

/* =====================================================================
   DEMO: CALCULADORA DE UN AJUSTE (F1 a F6)
   ===================================================================== */
function crearCalculadora(contenedor) {
  const caja = el("div", { class: "hoja" });
  caja.appendChild(el("p", {}, "<b>Calculadora de un ajuste.</b> Viene cargada con la instancia 4 del ejemplo de clase. Cambia cualquier valor y pulsa Calcular para ver la traza completa."));
  const campos = [["w1", "-2,10137"], ["w2", "3,11960"], ["θ", "0,191448"], ["x1", "3,1"], ["x2", "7,7"], ["x0", "-1"], ["γ", "0,25"], ["d", "-1"], ["umbral", "0"]];
  const rejilla = el("div", { class: "rejilla-campos" });
  const entradas = {};
  campos.forEach(([n, v]) => {
    const c = el("div", { class: "campo" });
    const id = "calc-" + n.replace("θ", "theta").replace("γ", "gamma");
    c.append(el("label", { for: id }, n), entradas[n] = el("input", { id, value: v, inputmode: "decimal" }));
    rejilla.appendChild(c);
  });
  const salida = el("div", { class: "traza", "aria-live": "polite" }, "Pulsa Calcular.");
  const fila = el("div", { class: "fila-botones" });
  let ultimo = null;
  const calcular = () => {
    const v = {}; for (const n in entradas) v[n] = leerNumero(entradas[n].value);
    if (Object.values(v).some(Number.isNaN)) { salida.innerHTML = '<span class="mal">Hay un campo que no es un número. Revisa que uses coma o punto decimal.</span>'; return; }
    const S = v.w1 * v.x1 + v.w2 * v.x2 + v["θ"] * v.x0;
    const yv = S >= v.umbral ? 1 : -1, e = v.d - yv;
    const nw1 = v.w1 + v["γ"] * e * v.x1, nw2 = v.w2 + v["γ"] * e * v.x2, nt = v["θ"] + v["γ"] * e * v.x0;
    let t = `F1  S = (${fmt(v.w1)})(${fmt(v.x1, 3)}) + (${fmt(v.w2)})(${fmt(v.x2, 3)}) + (${fmt(v["θ"])})(${fmt(v.x0, 0)})\n      = ${fmt(S)}\n`;
    t += `F2  S ${S >= v.umbral ? "≥" : "<"} ${fmt(v.umbral, 2)}  →  y = ${yv}\n`;
    t += `F4  e = d − y = ${v.d} − (${yv}) = ${e}\n`;
    if (e === 0) t += `<span class="ok">e = 0: la instancia está bien clasificada y los pesos no cambian.</span>`;
    else {
      t += `<span class="mal">e ≠ 0: hay que ajustar.</span>\n`;
      t += `F5  w1 = ${fmt(v.w1)} + ${fmt(v["γ"], 2)}·(${e})·(${fmt(v.x1, 3)}) = ${fmt(nw1)}\n`;
      t += `F5  w2 = ${fmt(v.w2)} + ${fmt(v["γ"], 2)}·(${e})·(${fmt(v.x2, 3)}) = ${fmt(nw2)}\n`;
      t += `F6  θ  = ${fmt(v["θ"])} + ${fmt(v["γ"], 2)}·(${e})·(${fmt(v.x0, 0)}) = ${fmt(nt)}`;
    }
    salida.innerHTML = t;
    ultimo = { nw1, nw2, nt };
  };
  fila.append(
    el("button", { class: "boton", onclick: calcular }, "Calcular"),
    el("button", { class: "boton secundario", onclick: () => {
      // Se recalcula siempre con lo que hay escrito; si algún campo no es un número, se detiene
      ultimo = null; calcular(); if (!ultimo) return;
      // 6 decimales para no perder el último dígito de θ (0,691448) y obtener el mismo S5 que el programa
      entradas.w1.value = fmt(ultimo.nw1, 6); entradas.w2.value = fmt(ultimo.nw2, 6); entradas["θ"].value = fmt(ultimo.nt, 6);
      entradas.x1.value = "5,1"; entradas.x2.value = "6,3"; entradas.d.value = "-1"; calcular();
    } }, "Siguiente: instancia 5 con los pesos nuevos")
  );
  caja.append(rejilla, fila, salida);
  contenedor.appendChild(caja);
}

/* =====================================================================
   DEMO: NEWTON-RAPHSON PASO A PASO
   ===================================================================== */
function crearNewton(contenedor) {
  const caja = el("div", { class: "hoja" });
  caja.appendChild(el("p", {}, "<b>Raíz cuadrada a mano.</b> Escribe un número positivo y mira cómo la iteración r ← ½(r + a/r) se acerca a la raíz, igual que en <code>raiz_cuadrada</code>."));
  const c = el("div", { class: "campo" });
  const entrada = el("input", { id: "newton-a", value: "3", inputmode: "decimal" });
  c.append(el("label", { for: "newton-a" }, "a"), entrada);
  const salida = el("div", { class: "traza" });
  const correr = () => {
    const a = leerNumero(entrada.value);
    if (!(a > 0)) { salida.innerHTML = '<span class="mal">Escribe un número mayor que cero.</span>'; return; }
    const coma = v => String(v).replace(".", ",");   // coma decimal, como en el resto de la app
    let r = a >= 1 ? a : 1, t = `r0 = ${coma(r)}\n`;
    for (let k = 1; k <= 1100; k++) {
      const nuevo = 0.5 * (r + a / r);
      t += `r${k} = ½(${coma(r.toPrecision(12))} + ${coma(a)}/${coma(r.toPrecision(12))}) = ${coma(nuevo.toPrecision(16))}\n`;
      if (Math.abs(nuevo - r) <= 1e-16 * nuevo) { t += `<span class="ok">Se detiene: r ya no cambia. Raíz de ${coma(a)} ≈ ${coma(nuevo.toPrecision(16))}</span>`; break; }
      r = nuevo;
    }
    salida.innerHTML = t;
  };
  const fila = el("div", { class: "fila-botones" }, "");
  fila.appendChild(el("button", { class: "boton", onclick: correr }, "Calcular paso a paso"));
  caja.append(c, fila, salida);
  contenedor.appendChild(caja);
  correr();
}
